<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Subnet Master v3.0.0 - サブネット・ルーティング実戦特訓</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --terminal-bg: #090e17;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --tag-bg: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Top Navigation, Language Switcher & Stats */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Language Switcher */
    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .lang-btn:hover { color: var(--text-main); }
    .lang-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 1rem;
      background: var(--card-bg);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-weight: bold; font-size: 1.05rem; }
    .stat-val.streak { color: var(--warning); }
    .stat-val.accuracy { color: var(--success); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); }

    /* Control Panel */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: var(--card-bg);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    label { color: var(--text-muted); white-space: nowrap; }
    select, button.btn-secondary {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      max-width: 100%;
    }
    select:focus { border-color: var(--accent); }
    button.btn-secondary:hover { border-color: var(--text-muted); }
    button.btn-secondary.active {
      border-color: var(--warning);
      color: var(--warning);
    }

    /* Question Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.85rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.35rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      min-width: 0;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .q-category {
      background: var(--tag-bg);
      color: var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .timer-badge {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .timer-badge.active { color: var(--warning); }
    .q-prompt {
      font-size: 1.2rem;
      line-height: 1.65;
      font-weight: 600;
      min-width: 0;
      overflow-wrap: break-word;
    }
    .highlight-ip {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.96em;
      word-break: break-all;
    }

    /* Cisco IOS CLI / Topology Exhibit Block */
    .cli-exhibit {
      margin-top: 0.85rem;
      background: var(--terminal-bg);
      border: 1px solid #263348;
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      font-weight: 400;
      line-height: 1.55;
      color: #e2e8f0;
      overflow-x: auto;
      white-space: pre;
    }
    .cli-exhibit .cli-muted { color: #64748b; }
    .cli-exhibit .cli-hl { color: #38bdf8; font-weight: 600; }
    .cli-exhibit .cli-warn { color: #f87171; font-weight: 600; }

    /* Interaction Area */
    .interaction-area {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      min-width: 0;
    }
    .input-row {
      display: flex;
      gap: 0.75rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1.1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="text"].wrong { border-color: var(--danger); }
    input[type="text"].correct { border-color: var(--success); }

    .btn-primary {
      background: var(--accent);
      flex-shrink: 0;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-reveal {
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      align-self: flex-start;
    }
    .btn-reveal:hover { color: var(--text-main); border-color: var(--text-muted); }

    /* Binary Choice (Yes / No) */
    .choice-group {
      display: flex;
      gap: 1rem;
    }
    .choice-btn {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 0.85rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .choice-btn:hover:not(.locked) { border-color: var(--accent); }
    .choice-btn.correct { border-color: var(--success); background: rgba(52, 211, 153, 0.12); color: var(--success); }
    .choice-btn.wrong { border-color: var(--danger); background: rgba(248, 113, 113, 0.12); color: var(--danger); }
    .choice-btn.locked { cursor: default; }

    /* 4-Option Exam Multiple Choice (A / B / C / D) */
    .mcq-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .mcq-btn {
      width: 100%;
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      text-align: left;
      background: var(--bg);
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      line-height: 1.45;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .mcq-btn:hover:not(.locked) {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }
    .mcq-key {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.65rem;
      height: 1.65rem;
      border-radius: 5px;
      background: var(--tag-bg);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .mcq-text {
      flex: 1;
      min-width: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .mcq-text.prose {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
    }
    .mcq-btn.correct {
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.12);
    }
    .mcq-btn.correct .mcq-key {
      background: var(--success);
      color: #0f172a;
    }
    .mcq-btn.wrong {
      border-color: var(--danger);
      background: rgba(248, 113, 113, 0.12);
    }
    .mcq-btn.wrong .mcq-key {
      background: var(--danger);
      color: #0f172a;
    }
    .mcq-btn.locked { cursor: default; }

    /* Answer & CCNA Breakdown Section */
    .answer-box {
      border-top: 1px solid var(--card-border);
      padding-top: 1.25rem;
      display: none;
      animation: slideDownFade 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideDownFade {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result-badge {
      display: inline-block;
      font-weight: bold;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    .result-correct { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .result-wrong { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .correct-answer-text {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    /* CCNA Magic Number Breakdown Panel */
    .ccna-breakdown {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      overflow-x: auto;
    }
    .magic-step {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .step-label {
      color: var(--accent);
      font-weight: bold;
      min-width: 150px;
    }
    .eval-list {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      width: 100%;
      margin-top: 0.2rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.83rem;
    }
    .eval-item {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: rgba(30, 41, 59, 0.7);
    }
    .eval-item.win {
      border-left: 3px solid var(--success);
      background: rgba(52, 211, 153, 0.1);
    }
    .eval-item.miss {
      opacity: 0.85;
      border-left: 3px solid var(--danger);
    }

    /* Bottom Action Row */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* CCNA Cheat Sheet Collapsible Panel */
    .cheat-sheet-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .cheat-sheet-header {
      padding: 0.75rem 1rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      user-select: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }
    .cheat-sheet-content {
      padding: 1rem;
      border-top: 1px solid var(--card-border);
      display: none;
      overflow-x: auto;
    }
    table.cheat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: center;
    }
    table.cheat-table th, table.cheat-table td {
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.5rem;
    }
    table.cheat-table th { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
    table.cheat-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

    .shortcut-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      line-height: 1.5;
    }

    /* Mobile Responsive Layout */
    @media (max-width: 640px) {
      body {
        padding: 0.75rem 0.5rem 2rem;
      }
      .container {
        gap: 0.85rem;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }
      .header-left {
        justify-content: space-between;
      }
      .header-right {
        justify-content: space-between;
        width: 100%;
        gap: 0.5rem;
      }
      .lang-switcher {
        flex-shrink: 0;
      }
      .stats-bar {
        flex: 1;
        justify-content: space-around;
        padding: 0.35rem 0.5rem;
        gap: 0.5rem;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
        padding: 0.75rem;
      }
      .control-group {
        width: 100%;
        justify-content: space-between;
      }
      .control-group select {
        flex: 1;
        min-width: 0;
        max-width: 65%;
      }
      .card {
        padding: 1.2rem 0.95rem;
        gap: 1.15rem;
        border-radius: 10px;
      }
      .q-prompt {
        font-size: 1.05rem;
        line-height: 1.55;
      }
      .cli-exhibit {
        font-size: 0.75rem;
        padding: 0.65rem 0.75rem;
      }
      /* Stack input and submit button vertically on mobile to prevent horizontal overflow */
      .input-row {
        flex-direction: column;
        width: 100%;
        gap: 0.65rem;
      }
      input[type="text"] {
        width: 100%;
        min-width: 0;
        padding: 0.75rem 0.85rem;
        font-size: 1rem;
      }
      .btn-primary {
        width: 100%;
        padding: 0.8rem 1rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-reveal {
        width: 100%;
        text-align: center;
        padding: 0.65rem 1rem;
      }
      .choice-group {
        flex-direction: column;
        gap: 0.65rem;
      }
      .mcq-btn {
        padding: 0.65rem 0.75rem;
        font-size: 0.85rem;
        gap: 0.55rem;
      }
      .action-row {
        width: 100%;
      }
      .action-row .btn-primary {
        width: 100%;
      }
      .magic-step {
        flex-direction: column;
        gap: 0.2rem;
      }
      .step-label {
        min-width: auto;
      }
      .cheat-sheet-content {
        padding: 0.5rem;
      }
      table.cheat-table {
        font-size: 0.72rem;
      }
      table.cheat-table th, table.cheat-table td {
        padding: 0.35rem 0.2rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header: Title, Language Switcher & Stats -->
  <header>
    <div class="header-left">
      <h1>Subnet Master <span class="badge" id="appBadge">CCNA 実戦特訓 v3.0</span></h1>
    </div>
    <div class="header-right">
      <!-- Language Switcher (Default: Japanese) -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-val streak" id="statStreak">0</span>
          <span class="stat-label" id="labelStreak">連続正解</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="statTotal">0</span>
          <span class="stat-label" id="labelTotal">回答数</span>
        </div>
        <div class="stat-item">
          <span class="stat-val accuracy" id="statAccuracy">0%</span>
          <span class="stat-label" id="labelAccuracy">正答率</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Controls & Filters -->
  <div class="controls">
    <div class="control-group">
      <label for="categorySelect" id="labelCategory">出題タイプ：</label>
      <select id="categorySelect">
        <!-- Options dynamically injected via JS i18n -->
      </select>
    </div>

    <div class="control-group">
      <label for="prefixScope" id="labelScope">プレフィックス範囲：</label>
      <select id="prefixScope">
        <!-- Options dynamically injected via JS i18n -->
      </select>
    </div>

    <div class="control-group">
      <label for="modeSelect" id="labelMode">モード：</label>
      <select id="modeSelect">
        <!-- Options dynamically injected via JS i18n -->
      </select>
    </div>

    <!-- Stopwatch Toggle (Default: OFF) -->
    <div class="control-group">
      <button class="btn-secondary" id="timerToggleBtn">⏱ タイマー: OFF</button>
    </div>
  </div>

  <!-- Main Question Card -->
  <div class="card">
    <div class="q-meta">
      <span class="q-category" id="qTypeBadge">サブネット計算</span>
      <span class="timer-badge" id="timerDisplay">⏱ <span id="timerVal">OFF</span></span>
    </div>

    <div class="q-prompt" id="qPrompt">
      読み込み中...
    </div>

    <!-- User Interaction Area -->
    <div class="interaction-area" id="interactionArea">
      <!-- Text Input Mode -->
      <div class="input-row" id="textInputRow">
        <input type="text" id="answerInput" placeholder="回答を入力してEnter" autocomplete="off" spellcheck="false">
        <button class="btn-primary" id="submitBtn">送信 (Enter)</button>
      </div>

      <!-- Binary Choice Mode (Yes / No) -->
      <div class="choice-group" id="choiceGroup" style="display: none;">
        <button class="choice-btn" id="choiceBtnYes" data-choice="YES">はい (同一サブネット)</button>
        <button class="choice-btn" id="choiceBtnNo" data-choice="NO">いいえ (別サブネット)</button>
      </div>

      <!-- 4-Option Multiple Choice Mode (A / B / C / D) -->
      <div class="mcq-group" id="mcqGroup" style="display: none;">
        <!-- Dynamically rendered A, B, C, D buttons -->
      </div>

      <button class="btn-reveal" id="revealBtn">🤔 解説を見る (またはSpace)</button>
    </div>

    <!-- Answer Result & CCNA Explanation -->
    <div class="answer-box" id="answerBox">
      <div id="resultStatus"></div>
      <div class="correct-answer-text">
        <span id="targetAnswerLabel">正解:</span> <span class="highlight-ip" id="targetAnswer"></span>
      </div>

      <div class="ccna-breakdown" id="ccnaBreakdown">
        <!-- Dynamically injected step-by-step breakdown -->
      </div>

      <div class="action-row" style="margin-top: 1.25rem;">
        <button class="btn-primary" id="nextBtn">次の問題 (Enter)</button>
      </div>
    </div>
  </div>

  <!-- CCNA Cheat Sheet: Magic Number & Wildcard Reference -->
  <div class="cheat-sheet-card">
    <div class="cheat-sheet-header" id="cheatSheetToggle">
      <span id="cheatSheetTitle">📖 CCNA 必須：マジックナンバー・ワイルドカード早見表</span>
      <span id="cheatArrow">▼ クリックして展開</span>
    </div>
    <div class="cheat-sheet-content" id="cheatSheetContent">
      <table class="cheat-table">
        <thead>
          <tr id="cheatTableHead"></tr>
        </thead>
        <tbody id="cheatTableBody"></tbody>
      </table>
      <div id="cheatSheetTip" style="margin-top: 0.75rem; font-size: 0.78rem; color: var(--text-muted); line-height: 1.55;">
        <!-- Dynamically populated via i18n -->
      </div>
    </div>
  </div>

  <div class="shortcut-hint" id="shortcutHint">
    ショートカット: [Enter] 送信 / 次の問題 | [Space] 答え・解説表示 | [A-D / 1-4] 選択肢回答
  </div>
</div>

<script>
/**

      lpmMatchLine: (label, routeStr, rangeStr, prefix, isWinner) => `${label}: <code>${routeStr}</code> ➔ 範囲 [${rangeStr}] にマッチ (${isWinner ? `<strong>最長一致 /${prefix} ★ 最適経路</strong>` : `/${prefix}`})`,

      lpmWinnerText: (optLetter, routeStr, reasonMode) => {

      vlsmTrapAlignText: (badNet, optP, magic, actualBase) => `【CCNAの罠・境界不整合】<code>${badNet}/${optP}</code> はマジックナンバー (${magic}) の倍数境界に合致していません。正しいサブネットの開始境界は <code>${actualBase}/${optP}</code> です。`,

      wcCalcStep1: (mask, wc) => `ワイルドカードマスク ＝ 255.255.255.255 － サブネットマスク (<code>${mask}</code>) ＝ <strong><code>${wc}</code></strong>`,
      wcCalcStep2: (octName, magic, wcByte) => `着目オクテット <strong>${octName}</strong> のワイルドカード値 ＝ マジックナンバー (${magic}) － 1 ＝ <strong>${wcByte}</strong> (255 － マスク値)`,
      wcRangeText: (net, bc) => `このワイルドカードマスクは、ネットワーク <strong>${net}</strong> から ブロードキャスト <strong>${bc}</strong> までの全IPアドレスと正確にマッチします。`,

        if (faultType === 'PC_GW') {

        }
        if (faultType === 'PC_IP') {
          return `PC1 の IP <code>${pcIp}</code> は R1 のサブネット範囲 [${rtrRange}] 外です。PC1 の IP アドレスを R1 と同一サブネット内の有効ホスト IP に修正する必要があります。`;
        }
        return `R1 のインターフェース間でサブネットの重複 (IP address overlap) が発生しています。IP アドレスの重複を解消する必要があります。`;

    }

      tsBadMaskText: (ip, prefix, mask, magic, net, bc, isBroadcast) => `Configured IP <code>${ip}/${prefix}</code> (Mask <code>${mask}</code>, block size ${magic}) is the <strong>${isBroadcast ? 'broadcast address' : 'network address (network ID)'}</strong> of the subnet [${net} - ${bc}]. Cisco IOS rejects assigning a subnet ${isBroadcast ? 'broadcast' : 'network'} address to an interface, throwing "Bad mask / Invalid host address".`,
      tsMismatchText: (pcIp, pcMask, pcP, pcRange, rtrIp, rtrP, rtrRange, pcGw, faultType) => {
        if (faultType === 'PC_MASK') {

    }

/**
 * CCNA Bitwise Subnet & Routing Calculation Core
 */
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

class SubnetUtils {
  static ipToInt(ip) {
    return ip.split('.').reduce((acc, octet) => ((acc << 8) + parseInt(octet, 10)) >>> 0, 0);
  }

  static intToIp(int) {
    return [
      (int >>> 24) & 255,
      (int >>> 16) & 255,
      (int >>> 8) & 255,
      int & 255
    ].join('.');
  }

  static isValidIpv4(str) {
    if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(str)) return false;
    return str.split('.').every(o => {
      const n = Number(o);
      return n >= 0 && n <= 255 && String(n) === o;
    });
  }

  static prefixToMaskInt(prefix) {
    if (prefix <= 0) return 0;
    if (prefix >= 32) return 0xFFFFFFFF >>> 0;
    return (~0 << (32 - prefix)) >>> 0;
  }

  static maskStrToPrefix(maskStr) {
    if (!this.isValidIpv4(maskStr)) return null;
    const mInt = this.ipToInt(maskStr);
    for (let p = 0; p <= 32; p++) {
      if (this.prefixToMaskInt(p) === mInt) return p;
    }
    return null;
  }

  static byteToBin(b) {
    return (b & 255).toString(2).padStart(8, '0');
  }

  static prefixToBinaryMask(prefix) {
    const bits = '1'.repeat(prefix) + '0'.repeat(32 - prefix);
    return [
      bits.slice(0, 8),
      bits.slice(8, 16),
      bits.slice(16, 24),
      bits.slice(24, 32)
    ].join('.');
  }

  static getOctets(ipStr) {
    return ipStr.split('.').map(Number);
  }

  static blockCountIps(prefix) {
    return Math.pow(2, 32 - prefix);
  }

  static calc(ipStr, prefix) {
    const ipInt = this.ipToInt(ipStr);
    const maskInt = this.prefixToMaskInt(prefix);
    const wildcardInt = (~maskInt) >>> 0;

    const netInt = (ipInt & maskInt) >>> 0;
    const bcastInt = (netInt | wildcardInt) >>> 0;

    let firstHostInt, lastHostInt, secondLastHostInt, hostsCount;
    if (prefix === 31) {
      firstHostInt = netInt;
      lastHostInt = bcastInt;
      secondLastHostInt = netInt;
      hostsCount = 2;
    } else if (prefix === 32) {
      firstHostInt = netInt;
      lastHostInt = netInt;
      secondLastHostInt = netInt;
      hostsCount = 1;
    } else {
      firstHostInt = (netInt + 1) >>> 0;
      lastHostInt = (bcastInt - 1) >>> 0;
      secondLastHostInt = prefix <= 29 ? (bcastInt - 2) >>> 0 : firstHostInt;
      hostsCount = Math.pow(2, 32 - prefix) - 2;
    }

    const isBoundary = (prefix % 8 === 0);
    const octetIndex = prefix === 0 ? 1 : (isBoundary ? prefix / 8 : Math.floor(prefix / 8) + 1);

    const maskStr = this.intToIp(maskInt);
    const maskOctets = this.getOctets(maskStr);
    const interestingMaskVal = isBoundary ? (prefix === 0 ? 0 : 255) : maskOctets[octetIndex - 1];
    const magicNumber = isBoundary ? 1 : 256 - interestingMaskVal;
    const wcOctetVal = 255 - interestingMaskVal;

    return {
      ip: ipStr,
      prefix,
      ipInt,
      netInt,
      bcastInt,
      maskInt,
      wildcardInt,
      isBoundary,
      mask: maskStr,
      wildcard: this.intToIp(wildcardInt),
      binaryMask: this.prefixToBinaryMask(prefix),
      network: this.intToIp(netInt),
      broadcast: this.intToIp(bcastInt),
      firstHost: this.intToIp(firstHostInt),
      lastHost: this.intToIp(lastHostInt),
      secondLastHost: this.intToIp(secondLastHostInt),
      usableHosts: hostsCount,
      octetIndex,
      magicNumber,
      maskOctetVal: interestingMaskVal,
      wcOctetVal
    };
  }
}
