/**
 * Pick prefix length (/8 ~ /30) weighted by CCNA 200-301 exam distribution
 */
function pickPrefix(scope) {
  if (scope === 'CLASS_C') return randInt(24, 30);
  if (scope === 'CLASS_B') return randInt(16, 23);
  if (scope === 'CLASS_A') return randInt(8, 15);

  // Mixed (/8 ~ /30) weighted by real CCNA 200-301 frequency
  const r = Math.random();
  if (r < 0.16) {
    // Class A (/8 ~ /15), extra weight on /8 and /12 (RFC 1918 & ACL favorites)
    return Math.random() < 0.35 ? pick([8, 12]) : randInt(8, 15);
  }
  if (r < 0.50) {
    // Class B (/16 ~ /23), extra weight on /19 ~ /23 (SIM labs & Campus SVIs)
    return Math.random() < 0.65 ? randInt(19, 23) : randInt(16, 23);
  }
  // Class C (/24 ~ /30), focus on subnetted /25 ~ /30 while including /24
  return Math.random() < 0.85 ? randInt(25, 30) : 24;
}

function pickNonBoundaryPrefix(scope) {
  if (scope === 'CLASS_C') return randInt(25, 30);
  if (scope === 'CLASS_B') return randInt(17, 23);
  if (scope === 'CLASS_A') return randInt(9, 15);
  const r = Math.random();
  if (r < 0.15) return randInt(9, 15);
  if (r < 0.48) return randInt(19, 23);
  return randInt(25, 30);
}

/**
 * Generate realistic CCNA IPv4 host address (including tricky .0/.255 unicast hosts on /8~/23)
 */
function generateValidHostIP(prefix, allowTrickyEdge = true) {
  let o1, o2, o3, o4;
  const poolRoll = Math.random();
  if (prefix >= 24) {
    if (poolRoll < 0.65) {
      o1 = 192; o2 = 168; o3 = randInt(1, 250);
    } else if (poolRoll < 0.88) {
      o1 = 10; o2 = randInt(1, 200); o3 = randInt(0, 254);
    } else {
      o1 = 209; o2 = 165; o3 = pick([200, 201, 202]);
    }
    o4 = randInt(1, 254);
  } else if (prefix >= 16) {
    if (poolRoll < 0.65) {
      o1 = 172; o2 = randInt(16, 31);
    } else {
      o1 = 10; o2 = randInt(10, 240);
    }
    o3 = randInt(0, 255);
    o4 = randInt(1, 254);
  } else {
    if (poolRoll < 0.78 || prefix < 12) {
      o1 = 10; o2 = randInt(0, 255);
    } else {
      o1 = 172; o2 = randInt(16, 31);
    }
    o3 = randInt(0, 255);
    o4 = randInt(1, 254);
  }

  const seedIp = `${o1}.${o2}.${o3}.${o4}`;
  const baseSub = SubnetUtils.calc(seedIp, prefix);

  if (prefix >= 31) return baseSub.firstHost;

  // On /8 ~ /23, 25% chance to pick a valid unicast host ending in .255 or .0 (Q914 exam trap)
  if (allowTrickyEdge && prefix <= 23 && Math.random() < 0.25) {
    const use255 = Math.random() < 0.6;
    const candInt = use255
      ? (baseSub.netInt + 255) >>> 0
      : (baseSub.netInt + 256) >>> 0;
    if (candInt > baseSub.netInt && candInt < baseSub.bcastInt) {
      return SubnetUtils.intToIp(candInt);
    }
  }

  // Pick a random valid host offset inside [1, min(usableHosts, 65534)]
  const maxSpan = Math.min(baseSub.usableHosts, 65000);
  let hostOffset = randInt(1, Math.max(1, maxSpan));
  let finalInt = (baseSub.netInt + hostOffset) >>> 0;
  if (finalInt <= baseSub.netInt) finalInt = (baseSub.netInt + 1) >>> 0;
  if (finalInt >= baseSub.bcastInt) finalInt = (baseSub.bcastInt - 1) >>> 0;
  return SubnetUtils.intToIp(finalInt);
}

/**
 * Category Selection with CCNA 200-301 Exam Weighting
 */
function pickCategory(selectedCat) {
  const coreCats = ['NET_ID', 'BROADCAST', 'HOST_BOUNDS', 'MASK_CONVERT', 'VALID_HOSTS', 'SAME_SUBNET'];
  const examCats = ['LPM_ROUTING', 'LPM_ROUTING', 'SIM_SUBNET_LAB', 'VLSM_DESIGN', 'WILDCARD_ACL', 'ROUTE_SUMMARY', 'IP_TROUBLESHOOT'];

  if (selectedCat === 'CORE_DRILL') return pick(coreCats);
  if (selectedCat === 'EXAM_HARD') return pick(examCats);
  if (selectedCat === 'ALL') {
    // 65% real CCNA scenario questions (7-12), 35% upgraded core speed drills (1-6)
    return Math.random() < 0.65 ? pick(examCats) : pick(coreCats);
  }
  return selectedCat;
}

/**
 * Question Data Builders (Language-Independent Mathematical Structures)
 */
function createQuestion() {
  const scope = document.getElementById('prefixScope').value || 'ALL';
  const rawCategory = document.getElementById('categorySelect').value || 'ALL';
  const category = pickCategory(rawCategory);

  let q = {
    category,
    scope,
    type: 'TEXT',          // 'TEXT' | 'CHOICE' | 'MCQ'
    placeholderKey: 'ip',
    optionsProse: false,   // true if MCQ options are natural language rather than CLI monospace
    acceptAnswers: []      // normalized valid text answers
  };

  switch (category) {
    case 'NET_ID':
    case 'BROADCAST':
    case 'HOST_BOUNDS': {
      let prefix = pickPrefix(scope);
      if (category === 'HOST_BOUNDS') {
        const roll = Math.random();
        q.boundType = roll < 0.38 ? 'FIRST' : (roll < 0.76 ? 'LAST' : 'SECOND_LAST');
        if (q.boundType === 'SECOND_LAST' && prefix === 30) prefix = 29;
      }
      const ip = generateValidHostIP(prefix, true);
      q.ip = ip;
      q.prefix = prefix;
      q.sub = SubnetUtils.calc(ip, prefix);
      const lastOctet = SubnetUtils.getOctets(ip)[3];
      q.isTrickyHostEdge = (prefix <= 23 && (lastOctet === 0 || lastOctet === 255));
      q.placeholderKey = 'ip';
      break;
    }

    case 'MASK_CONVERT': {
      const prefix = scope === 'ALL' && Math.random() < 0.12 ? 32 : pickPrefix(scope);
      const ip = generateValidHostIP(Math.min(prefix, 30), false);
      q.prefix = prefix;
      q.sub = SubnetUtils.calc(ip, prefix);
      const roll = Math.random();
      if (roll < 0.38) {
        q.convMode = 'CIDR_TO_MASK';
        q.placeholderKey = 'mask';
      } else if (roll < 0.70) {
        q.convMode = 'MASK_TO_CIDR';
        q.placeholderKey = 'cidr';
      } else {
        q.convMode = 'BIN_TO_CIDR';
        q.placeholderKey = 'cidr';
      }
      break;
    }

    case 'VALID_HOSTS': {
      if (Math.random() < 0.58) {
        q.countMode = 'HOSTS';
        q.prefix = pickPrefix(scope);
        q.sub = SubnetUtils.calc('10.0.0.1', q.prefix);
        q.placeholderKey = 'number';
      } else {
        q.countMode = 'SUBNETS';
        let baseP, borrowBits;
        if (scope === 'CLASS_A') {
          baseP = pick([8, 9, 10]); borrowBits = randInt(1, 5);
        } else if (scope === 'CLASS_B') {
          baseP = pick([16, 16, 17, 18, 19]); borrowBits = randInt(1, Math.min(6, 23 - baseP || 1));
        } else if (scope === 'CLASS_C') {
          baseP = pick([24, 24, 25, 26]); borrowBits = randInt(1, 30 - baseP);
        } else {
          baseP = pick([8, 16, 16, 19, 20, 24, 24]);
          borrowBits = randInt(2, Math.min(7, 30 - baseP));
        }
        const newP = baseP + borrowBits;
        const seedIp = generateValidHostIP(baseP, false);
        q.baseSub = SubnetUtils.calc(seedIp, baseP);
        q.newSub = SubnetUtils.calc(q.baseSub.network, newP);
        q.baseP = baseP;
        q.newP = newP;
        q.borrowBits = borrowBits;
        q.subnetCount = Math.pow(2, borrowBits);
        q.placeholderKey = 'number';
      }
      break;
    }

    case 'SAME_SUBNET': {
      q.type = 'CHOICE';
      const prefix = pickNonBoundaryPrefix(scope);
      const ipA = generateValidHostIP(prefix, false);
      const subA = SubnetUtils.calc(ipA, prefix);
      q.ip = ipA;
      q.prefix = prefix;
      q.sub = subA;
      q.isSame = Math.random() < 0.5;
      const blockIps = SubnetUtils.blockCountIps(prefix);

      if (q.isSame) {
        // Place Host B near opposite end of the SAME subnet (crosses 3rd/2nd octet on /8~/23!)
        const distFromStart = (subA.ipInt - subA.netInt) >>> 0;
        let targetInt;
        if (distFromStart < blockIps / 2) {
          targetInt = (subA.bcastInt - randInt(1, Math.min(12, Math.max(1, Math.floor(blockIps / 4))))) >>> 0;
        } else {
          targetInt = (subA.netInt + randInt(1, Math.min(12, Math.max(1, Math.floor(blockIps / 4))))) >>> 0;
        }
        if (targetInt === subA.ipInt) {
          targetInt = targetInt < subA.bcastInt - 1 ? (targetInt + 1) >>> 0 : (subA.netInt + 1) >>> 0;
        }
        q.host2Ip = SubnetUtils.intToIp(targetInt);
      } else {
        // Place Host B right across the adjacent block boundary to defeat guessing
        const goNext = (subA.netInt === 0) || Math.random() < 0.55;
        let adjNetInt;
        if (goNext) {
          adjNetInt = (subA.netInt + blockIps) >>> 0;
          q.host2Ip = SubnetUtils.intToIp((adjNetInt + randInt(1, Math.min(6, subA.usableHosts))) >>> 0);
        } else {
          adjNetInt = (subA.netInt - blockIps) >>> 0;
          const adjBcast = (adjNetInt + blockIps - 1) >>> 0;
          q.host2Ip = SubnetUtils.intToIp((adjBcast - randInt(1, Math.min(6, subA.usableHosts))) >>> 0);
        }
      }
      break;
    }

    case 'LPM_ROUTING': {
      buildLpmQuestion(q, scope);
      break;
    }

    case 'SIM_SUBNET_LAB': {
      buildSimLabQuestion(q, scope);
      break;
    }

    case 'VLSM_DESIGN': {
      buildVlsmQuestion(q, scope);
      break;
    }

    case 'WILDCARD_ACL': {
      buildWildcardQuestion(q, scope);
      break;
    }

    case 'ROUTE_SUMMARY': {
      buildSummaryQuestion(q, scope);
      break;
    }

    case 'IP_TROUBLESHOOT': {
      buildTroubleshootQuestion(q, scope);
      break;
    }
  }

  populateQuestionTexts(q);
  return q;
}

/**
 * 7. Longest Prefix Match (LPM) Routing Table Lookup Generator
 */
function buildLpmQuestion(q, scope) {
  q.type = 'MCQ';
  q.optionsProse = false;
  const roll = Math.random();
  q.lpmMode = roll < 0.65 ? 'TABLE' : (roll < 0.80 ? 'DEFAULT' : 'STATIC_CMD');

  let winP;
  if (scope === 'CLASS_A') winP = randInt(11, 15);
  else if (scope === 'CLASS_B') winP = randInt(19, 23);
  else if (scope === 'CLASS_C') winP = randInt(26, 30);
  else {
    const r = Math.random();
    if (r < 0.16 && q.lpmMode === 'TABLE') winP = 32; // Host route /32 (Q1360)
    else if (r < 0.45) winP = randInt(20, 23);         // /20~/23 (Q1209)
    else winP = randInt(26, 30);                       // /26~/30 (Q2, Q346, Q347, Q1174)
  }

  const destIp = generateValidHostIP(Math.min(winP, 30), true);
  const destInt = SubnetUtils.ipToInt(destIp);
  q.destIp = destIp;

  let entries = [];

  if (q.lpmMode === 'DEFAULT') {
    // 3 specific routes in the same neighborhood that ALL miss destIp + 1 default route 0.0.0.0/0
    const p1 = winP;
    const p2 = Math.max(9, winP - 2);
    const p3 = Math.min(30, winP + 1);
    const missSub1 = SubnetUtils.calc(SubnetUtils.intToIp((destInt ^ SubnetUtils.blockCountIps(p1)) >>> 0), p1);
    const missSub2 = SubnetUtils.calc(SubnetUtils.intToIp((destInt ^ SubnetUtils.blockCountIps(p2)) >>> 0), p2);
    const missSub3 = SubnetUtils.calc(SubnetUtils.intToIp((destInt ^ SubnetUtils.blockCountIps(p3)) >>> 0), p3);

    entries = [
      { isWinner: true, isDefault: true, matches: true, prefix: 0, net: '0.0.0.0', bc: '255.255.255.255', mask: '0.0.0.0', proto: 'S*', adMetric: '[1/0]' },
      { isWinner: false, isDefault: false, matches: false, prefix: p1, net: missSub1.network, bc: missSub1.broadcast, mask: missSub1.mask, proto: 'D', adMetric: '[90/28160]' },
      { isWinner: false, isDefault: false, matches: false, prefix: p2, net: missSub2.network, bc: missSub2.broadcast, mask: missSub2.mask, proto: 'O', adMetric: '[110/20]' },
      { isWinner: false, isDefault: false, matches: false, prefix: p3, net: missSub3.network, bc: missSub3.broadcast, mask: missSub3.mask, proto: 'S', adMetric: '[1/0]' }
    ];
    q.reasonMode = 'DEFAULT';
  } else {
    // Winner matches destIp with longest prefix, intentionally given higher AD (RIP/OSPF) to test AD trap (Q347, Q1360)
    const winSub = SubnetUtils.calc(destIp, winP);
    const broadP1 = Math.max(8, winP - randInt(2, 4));
    const broadSub1 = SubnetUtils.calc(destIp, broadP1);
    const broadP2 = Math.max(8, broadP1 - randInt(3, 6));
    const useZeroForP2 = (broadP2 >= broadP1);
    const broadSub2 = useZeroForP2 ? null : SubnetUtils.calc(destIp, broadP2);

    // Non-matching LONGER prefix trap (/31 RFC 3021 Q346 or /32 host route Q1223 or +1/+2 prefix)
    let trapP;
    if (winP === 32) {
      trapP = 30;
    } else if (winP === 30) {
      trapP = pick([31, 32]); // Classic Q346 /31 or Q1223 /32 trap!
    } else {
      trapP = Math.min(32, winP + randInt(1, 2));
    }
    const trapShiftedInt = (destInt ^ SubnetUtils.blockCountIps(trapP)) >>> 0;
    const trapSub = SubnetUtils.calc(SubnetUtils.intToIp(trapShiftedInt), trapP);

    entries = [
      {
        isWinner: true, isDefault: false, matches: true,
        prefix: winP, net: winSub.network, bc: winSub.broadcast, mask: winSub.mask,
        proto: pick(['R', 'O']), adMetric: winP === 32 ? '[110/21]' : '[120/2]'
      },
      {
        isWinner: false, isDefault: false, matches: true,
        prefix: broadP1, net: broadSub1.network, bc: broadSub1.broadcast, mask: broadSub1.mask,
        proto: 'D', adMetric: '[90/28160]'
      },
      useZeroForP2
        ? { isWinner: false, isDefault: true, matches: true, prefix: 0, net: '0.0.0.0', bc: '255.255.255.255', mask: '0.0.0.0', proto: 'S*', adMetric: '[1/0]' }
        : {
            isWinner: false, isDefault: false, matches: true,
            prefix: broadP2, net: broadSub2.network, bc: broadSub2.broadcast, mask: broadSub2.mask,
            proto: 'S', adMetric: '[1/0]'
          },
      {
        isWinner: false, isDefault: false, matches: false,
        prefix: trapP, net: trapSub.network, bc: trapSub.broadcast, mask: trapSub.mask,
        proto: 'S', adMetric: '[1/0]'
      }
    ];
    q.reasonMode = winP === 32 ? 'HOST32' : 'LONGEST';
  }

  const shuffled = shuffle(entries);
  const letters = ['A', 'B', 'C', 'D'];
  q.routes = shuffled.map((r, idx) => {
    const letter = letters[idx];
    const nh = `192.168.${idx + 1}.1`;
    const iface = `Gi0/${idx}`;
    const tableLine = `${r.proto.padEnd(3, ' ')} ${r.net}/${r.prefix} ${r.adMetric} via ${nh}, ${iface}`;
    const staticCmd = `ip route ${r.net} ${r.mask} ${nh}`;
    const displayLine = q.lpmMode === 'STATIC_CMD' ? staticCmd : `${r.proto} ${r.net}/${r.prefix} ${r.adMetric} via ${nh} (${iface})`;
    if (r.isWinner) {
      q.answer = letter;
      q.winRouteDisplay = displayLine;
    }
    return Object.assign({}, r, { letter, nh, iface, tableLine, staticCmd, displayLine });
  });
}

/**
 * 8. CCNA Simulation Lab: Nth Subnet & Interface Host Assignment (Q145, Q1058, Q1182, Q1337)
 */
function buildSimLabQuestion(q, scope) {
  q.type = 'TEXT';
  q.placeholderKey = 'ipCidr';
  q.simMode = Math.random() < 0.65 ? 'SITES' : 'NEXT_AVAIL';

  let baseP, s;
  if (scope === 'CLASS_A') {
    baseP = pick([8, 9, 10]);
    s = randInt(2, 5);
  } else if (scope === 'CLASS_B') {
    baseP = pick([16, 16, 17, 18, 19]);
    s = randInt(2, Math.min(5, 23 - baseP || 2));
  } else if (scope === 'CLASS_C') {
    baseP = pick([24, 24, 25]);
    s = randInt(2, Math.min(5, 30 - baseP));
  } else {
    // Include famous CCNA SIM combos: /16 -> /20 (Q1182), /19 -> /25 (Q1337), /24 -> /27 or /28 (Q145, Q1058), /8 -> /12
    const preset = pick([
      [16, 4], [19, 6], [24, 3], [24, 4], [16, 3], [20, 4], [8, 4], [18, 4], [24, 5]
    ]);
    baseP = preset[0];
    s = preset[1];
  }

  const newP = baseP + s;
  const seedIp = generateValidHostIP(baseP, false);
  const baseSub = SubnetUtils.calc(seedIp, baseP);
  const twoPowS = Math.pow(2, s);
  const blockSizeIps = SubnetUtils.blockCountIps(newP);

  q.baseNet = baseSub.network;
  q.baseP = baseP;
  q.s = s;
  q.twoPowS = twoPowS;
  q.newP = newP;
  q.isFirst = Math.random() < 0.55;

  if (q.simMode === 'SITES') {
    q.numSites = Math.random() < 0.65 ? twoPowS : randInt(Math.pow(2, s - 1) + 2, twoPowS - 1);
    q.nth = randInt(2, Math.min(4, twoPowS)); // 2nd, 3rd, or 4th subnet (1-indexed)
    q.iface = pick(['Sw101 e0/0', 'R1 Gi0/0', 'Sw102 VLAN10', 'R2 Gi0/1']);
  } else {
    const reservedCount = Math.random() < 0.7 ? 1 : 2;
    q.nth = reservedCount + 1;
    q.routerName = q.isFirst ? 'R1 (e0/1)' : 'R2 (e0/1)';
    const resList = [];
    for (let i = 0; i < reservedCount; i++) {
      const rInt = (baseSub.netInt + i * blockSizeIps) >>> 0;
      resList.push(`${SubnetUtils.intToIp(rInt)}/${newP}`);
    }
    q.unavailStr = resList.join(', ');
  }

  // Build sample list of first nth subnets for step-by-step explanation
  q.subnetSamples = [];
  for (let i = 0; i < q.nth; i++) {
    const sInt = (baseSub.netInt + i * blockSizeIps) >>> 0;
    q.subnetSamples.push(SubnetUtils.calc(SubnetUtils.intToIp(sInt), newP));
  }

  q.targetSub = q.subnetSamples[q.nth - 1];
  q.targetIp = q.isFirst ? q.targetSub.firstHost : q.targetSub.lastHost;
  q.answer = `${q.targetIp}/${newP}`;
  q.acceptAnswers = [
    `${q.targetIp}/${newP}`,
    `${q.targetIp} ${q.targetSub.mask}`
  ];
  if (q.simMode === 'NEXT_AVAIL') {
    q.acceptAnswers.push(q.targetIp);
  }
}

/**
 * 9. VLSM Capacity, Growth Buffer & Subnet Alignment Generator (Q35, Q37, Q129, Q476, Q904)
 */
function buildVlsmQuestion(q, scope) {
  const roll = Math.random();
  if (roll < 0.48) {
    // Sub-mode A: CLI Subnet + Mask Selection with Misaligned Subnet ID Trap (Q35, Q476)
    q.vlsmMode = 'CLI_ALIGN';
    q.type = 'MCQ';
    q.optionsProse = false;

    let optP;
    if (scope === 'CLASS_A') optP = randInt(11, 15);
    else if (scope === 'CLASS_B') optP = randInt(19, 23);
    else if (scope === 'CLASS_C') optP = randInt(25, 29);
    else optP = pick([21, 22, 23, 23, 25, 26, 27, 27, 28]);

    const h = 32 - optP;
    const usable = Math.pow(2, h) - 2;
    const prevUsable = Math.pow(2, h - 1) - 2;
    const hasGrowth = Math.random() < 0.45;
    let totalHosts = randInt(prevUsable + 2, Math.max(prevUsable + 2, Math.floor(usable * 0.9)));
    if (hasGrowth) {
      q.growthPct = pick([20, 25, 30]);
      q.baseUsers = Math.max(4, Math.floor(totalHosts / (1 + q.growthPct / 100)));
      totalHosts = Math.ceil(q.baseUsers * (1 + q.growthPct / 100));
      if (totalHosts <= prevUsable) totalHosts = prevUsable + 2;
    } else {
      q.growthPct = 0;
      q.baseUsers = totalHosts;
    }

    const basePoolP = optP >= 24 ? 24 : (optP >= 16 ? 16 : 8);
    const seedIp = generateValidHostIP(basePoolP, false);
    const poolSub = SubnetUtils.calc(seedIp, basePoolP);
    const blockIps = SubnetUtils.blockCountIps(optP);
    const blockIdx = optP > basePoolP ? randInt(1, Math.min(5, Math.pow(2, optP - basePoolP) - 1)) : 0;
    const alignedNetInt = (poolSub.netInt + blockIdx * blockIps) >>> 0;
    const alignedSub = SubnetUtils.calc(SubnetUtils.intToIp(alignedNetInt), optP);

    // Misaligned trap: shifted by half a block (e.g. .32 + 16 = .48 on /27, exact Q35 trap!)
    const halfBlock = Math.pow(2, h - 1);
    const misalignedNet = SubnetUtils.intToIp((alignedNetInt + halfBlock) >>> 0);
    const smallSub = SubnetUtils.calc(alignedSub.network, optP + 1);
    const bigP = Math.max(8, optP - 2);
    const bigSub = SubnetUtils.calc(alignedSub.network, bigP);

    q.isSvi = Math.random() < 0.4;
    q.poolStr = `${poolSub.network}/${basePoolP}`;
    q.totalHosts = totalHosts;
    q.h = h;
    q.usable = usable;
    q.optP = optP;
    q.alignedSub = alignedSub;
    q.misalignedNet = misalignedNet;

    let rawOpts;
    if (!q.isSvi) {
      rawOpts = [
        { isWin: true, text: `${alignedSub.network} ${alignedSub.mask}` },
        { isWin: false, text: `${alignedSub.network} ${smallSub.mask}` },
        { isWin: false, text: `${misalignedNet} ${alignedSub.mask}` },
        { isWin: false, text: `${bigSub.network} ${bigSub.mask}` }
      ];
    } else {
      rawOpts = [
        { isWin: true, text: `ip address ${alignedSub.firstHost} ${alignedSub.mask}` },
        { isWin: false, text: `ip address ${alignedSub.firstHost} ${smallSub.mask}` },
        { isWin: false, text: `ip address ${alignedSub.broadcast} ${alignedSub.mask}` },
        { isWin: false, text: `ip address ${bigSub.firstHost} ${bigSub.mask}` }
      ];
    }
    const letters = ['A', 'B', 'C', 'D'];
    q.vlsmOpts = shuffle(rawOpts).map((o, idx) => {
      if (o.isWin) {
        q.answer = letters[idx];
        q.winText = o.text;
      }
      return { letter: letters[idx], text: o.text, isWin: o.isWin };
    });
  } else if (roll < 0.72) {
    // Sub-mode B: Inter-Router Link + Growth Conservation (Q904)
    q.vlsmMode = 'LINK_GROWTH';
    q.type = 'MCQ';
    q.optionsProse = false;

    const scenarios = [
      { routers: 2, extra: 2, optP: 29 },  // Exact Q904: 2 + 2 = 4 usable -> /29 (6 usable; /30 only has 2!)
      { routers: 2, extra: 0, optP: 30 },  // Pure P2P: 2 usable -> /30
      { routers: 2, extra: 5, optP: 28 },  // 2 + 5 = 7 usable -> /28 (14 usable; /29 only has 6!)
      { routers: 3, extra: 4, optP: 28 },  // 3 + 4 = 7 usable -> /28
      { routers: 4, extra: 12, optP: 27 }  // 4 + 12 = 16 usable -> /27 (30 usable; /28 only has 14!)
    ];
    const sc = pick(scenarios);
    q.numRouters = sc.routers;
    q.extraIps = sc.extra;
    q.totalNeeded = sc.routers + sc.extra;
    q.optP = sc.optP;

    const baseIp = `10.${randInt(10, 99)}.${randInt(1, 50)}.0`;
    const optSub = SubnetUtils.calc(baseIp, sc.optP);
    const tooSmallP = Math.min(30, sc.optP + 1);
    const tooSmallSub = SubnetUtils.calc(baseIp, tooSmallP);
    const wastefulP = sc.optP - 2;
    const wastefulSub = SubnetUtils.calc(baseIp, wastefulP);

    q.optSub = optSub;
    const r2ValidIp = SubnetUtils.intToIp((optSub.netInt + 2) >>> 0);

    let rawOpts;
    if (sc.optP === 30) {
      // Include .3 broadcast trap on /30!
      rawOpts = [
        { isWin: true, text: `R1: ip address ${optSub.firstHost} ${optSub.mask} | R2: ip address ${optSub.lastHost} ${optSub.mask}` },
        { isWin: false, text: `R1: ip address ${optSub.firstHost} ${optSub.mask} | R2: ip address ${optSub.broadcast} ${optSub.mask}` },
        { isWin: false, text: `R1: ip address ${optSub.network} ${optSub.mask} | R2: ip address ${optSub.firstHost} ${optSub.mask}` },
        { isWin: false, text: `R1: ip address ${wastefulSub.firstHost} ${wastefulSub.mask} | R2: ip address ${r2ValidIp} ${wastefulSub.mask}` }
      ];
    } else {
      rawOpts = [
        { isWin: true, text: `R1: ip address ${optSub.firstHost} ${optSub.mask} | R2: ip address ${r2ValidIp} ${optSub.mask}` },
        { isWin: false, text: `R1: ip address ${tooSmallSub.firstHost} ${tooSmallSub.mask} | R2: ip address ${tooSmallSub.lastHost} ${tooSmallSub.mask}` },
        { isWin: false, text: `R1: ip address ${optSub.firstHost} ${optSub.mask} | R2: ip address ${optSub.broadcast} ${optSub.mask}` },
        { isWin: false, text: `R1: ip address ${wastefulSub.firstHost} ${wastefulSub.mask} | R2: ip address ${r2ValidIp} ${wastefulSub.mask}` }
      ];
    }

    const letters = ['A', 'B', 'C', 'D'];
    q.vlsmOpts = shuffle(rawOpts).map((o, idx) => {
      if (o.isWin) {
        q.answer = letters[idx];
        q.winText = o.text;
      }
      return { letter: letters[idx], text: o.text, isWin: o.isWin };
    });
  } else {
    // Sub-mode C: Multi-Floor / Growth % Optimal Dotted Mask Input (Q37, Q129)
    q.vlsmMode = 'MASK_INPUT';
    q.type = 'TEXT';
    q.placeholderKey = 'mask';

    let optP;
    if (scope === 'CLASS_A') optP = randInt(12, 15);
    else if (scope === 'CLASS_B') optP = randInt(19, 23);
    else if (scope === 'CLASS_C') optP = randInt(25, 29);
    else optP = pick([21, 22, 23, 23, 25, 26, 27, 28]);

    const h = 32 - optP;
    const usable = Math.pow(2, h) - 2;
    const prevUsable = Math.pow(2, h - 1) - 2;

    if (optP >= 21 && optP <= 27 && Math.random() < 0.5) {
      q.isFloorScenario = true;
      q.floors = pick([4, 6, 8]);
      const targetTotal = randInt(prevUsable + q.floors, Math.floor(usable * 0.88));
      q.perFloor = Math.max(3, Math.ceil(targetTotal / q.floors));
      q.totalHosts = q.floors * q.perFloor;
      // Re-verify optP after rounding
      while (Math.pow(2, 32 - optP) - 2 < q.totalHosts) optP--;
    } else {
      q.isFloorScenario = false;
      q.pct = pick([20, 25, 30]);
      const targetTotal = randInt(prevUsable + 4, Math.floor(usable * 0.88));
      q.curUsers = Math.max(4, Math.floor(targetTotal / (1 + q.pct / 100)));
      q.totalHosts = Math.ceil(q.curUsers * (1 + q.pct / 100));
      if (q.totalHosts <= prevUsable) {
        q.curUsers = Math.ceil((prevUsable + 3) / (1 + q.pct / 100));
        q.totalHosts = Math.ceil(q.curUsers * (1 + q.pct / 100));
      }
      while (Math.pow(2, 32 - optP) - 2 < q.totalHosts) optP--;
    }

    q.optP = optP;
    q.h = 32 - optP;
    q.usable = Math.pow(2, q.h) - 2;
    q.optSub = SubnetUtils.calc('10.0.0.0', optP);
    q.answer = q.optSub.mask;
    q.acceptAnswers = [q.optSub.mask, `/${optP}`];
  }
}

/**
 * 10. Wildcard Mask & OSPF / Extended ACL Generator (Q398, Q486, Q696, Q976, Q1369)
 */
function buildWildcardQuestion(q, scope) {
  const roll = Math.random();
  if (roll < 0.50) {
    // Sub-mode A: Wildcard Mask Calculation Input
    q.wcMode = 'WC_CALC';
    q.type = 'TEXT';
    q.placeholderKey = 'wildcard';
    const prefix = (scope === 'ALL' && Math.random() < 0.1) ? 32 : pickPrefix(scope);
    const ip = generateValidHostIP(Math.min(prefix, 30), false);
    q.sub = SubnetUtils.calc(ip, prefix);
    q.prefix = prefix;
    q.contextType = Math.random() < 0.5 ? 'OSPF' : 'ACL';
    q.answer = q.sub.wildcard;
    q.acceptAnswers = [q.sub.wildcard];
  } else if (roll < 0.78) {
    // Sub-mode B: Extended ACL CLI Statement Selection (Q976, Q696, Q999)
    q.wcMode = 'ACL_CLI';
    q.type = 'MCQ';
    q.optionsProse = false;

    const srcP = pickNonBoundaryPrefix(scope);
    const dstP = scope === 'ALL' ? pick([8, 12, 20, 25, 26, 27, 28, 30]) : pickPrefix(scope);
    const srcSub = SubnetUtils.calc(generateValidHostIP(srcP, false), srcP);
    let dstSeed = generateValidHostIP(dstP, false);
    if (dstSeed.split('.')[0] === srcSub.network.split('.')[0]) {
      dstSeed = srcSub.network.startsWith('10.') ? `192.168.${randInt(10, 240)}.5` : `10.${randInt(10, 200)}.${randInt(1, 200)}.5`;
    }
    const dstSub = SubnetUtils.calc(dstSeed, dstP);
    const svc = pick([
      { app: 'HTTP', port: 80, action: 'deny' },
      { app: 'SSH', port: 22, action: 'permit' },
      { app: 'HTTPS', port: 443, action: 'permit' }
    ]);

    q.srcSub = srcSub;
    q.dstSub = dstSub;
    q.svc = svc;

    // Trap wildcard off-by-one: uses MagicNumber instead of MagicNumber - 1 in interesting octet
    const badOctets = SubnetUtils.getOctets(srcSub.wildcard);
    badOctets[srcSub.octetIndex - 1] = Math.min(255, srcSub.wcOctetVal + 1);
    const offByOneWc = badOctets.join('.');

    const rawOpts = [
      { isWin: true, text: `${svc.action} tcp ${srcSub.network} ${srcSub.wildcard} ${dstSub.network} ${dstSub.wildcard} eq ${svc.port}` },
      { isWin: false, text: `${svc.action} tcp ${srcSub.network} ${srcSub.mask} ${dstSub.network} ${dstSub.mask} eq ${svc.port}` },
      { isWin: false, text: `${svc.action} tcp ${srcSub.network} ${offByOneWc} ${dstSub.network} ${dstSub.wildcard} eq ${svc.port}` },
      { isWin: false, text: `${svc.action} tcp ${dstSub.network} ${dstSub.wildcard} ${srcSub.network} ${srcSub.wildcard} eq ${svc.port}` }
    ];
    const letters = ['A', 'B', 'C', 'D'];
    q.wcOpts = shuffle(rawOpts).map((o, idx) => {
      if (o.isWin) {
        q.answer = letters[idx];
        q.winText = o.text;
      }
      return { letter: letters[idx], text: o.text };
    });
  } else {
    // Sub-mode C: OSPF Wildcard Interface Matching (Q398)
    q.wcMode = 'OSPF_IFACE';
    q.type = 'MCQ';
    q.optionsProse = false;

    const p = pickNonBoundaryPrefix(scope);
    const sub = SubnetUtils.calc(generateValidHostIP(p, false), p);
    const blockIps = SubnetUtils.blockCountIps(p);
    // Ensure netInt > blockIps so we can place a distractor below netInt safely
    const safeSub = sub.netInt >= blockIps
      ? sub
      : SubnetUtils.calc(SubnetUtils.intToIp((sub.netInt + blockIps * 2) >>> 0), p);

    q.sub = safeSub;
    const winIp = SubnetUtils.intToIp((safeSub.netInt + randInt(1, Math.max(1, Math.min(safeSub.usableHosts, 200)))) >>> 0);
    const lowMissIp = SubnetUtils.intToIp((safeSub.netInt - randInt(1, Math.min(10, blockIps - 1))) >>> 0);
    const highMissIp = SubnetUtils.intToIp((safeSub.bcastInt + randInt(1, 10)) >>> 0);
    const farMissIp = SubnetUtils.intToIp((safeSub.bcastInt + blockIps + randInt(2, 14)) >>> 0);

    const rawIps = shuffle([
      { isWin: true, ip: winIp },
      { isWin: false, ip: lowMissIp },
      { isWin: false, ip: highMissIp },
      { isWin: false, ip: farMissIp }
    ]);
    const letters = ['A', 'B', 'C', 'D'];
    q.ospfIfaces = rawIps.map((item, idx) => {
      const label = `GigabitEthernet0/${idx} — ${item.ip}/${p}`;
      if (item.isWin) {
        q.answer = letters[idx];
        q.winText = label;
      }
      return { letter: letters[idx], text: label, ip: item.ip, isWin: item.isWin };
    });
  }
}

/**
 * 11. CIDR Route Summarization / Supernetting Generator (Q34, Q129, Q391, Q1198)
 */
function buildSummaryQuestion(q, scope) {
  q.type = 'TEXT';
  q.placeholderKey = 'ipCidr';

  const k = Math.random() < 0.55 ? 2 : 1; // Summarize 4 contiguous blocks (55%) or 2 contiguous blocks (45%, Q1198)
  let sumP;
  if (scope === 'CLASS_A') sumP = randInt(8, 15 - k);
  else if (scope === 'CLASS_B') sumP = randInt(16, 23 - k);
  else if (scope === 'CLASS_C') sumP = randInt(24, 30 - k);
  else sumP = pick([14, 15, 19, 20, 21, 22, 22, 23, 23, 25, 26]);

  const compP = sumP + k;
  const count = Math.pow(2, k);
  const seedIp = generateValidHostIP(sumP, false);
  const sumSub = SubnetUtils.calc(seedIp, sumP);
  const compBlockIps = SubnetUtils.blockCountIps(compP);

  q.sumSub = sumSub;
  q.sumP = sumP;
  q.compP = compP;
  q.count = count;
  q.protoName = pick(['OSPF Area 1', 'EIGRP AS 100', 'BGP', 'OSPF Area 0']);

  q.compSubnets = [];
  for (let i = 0; i < count; i++) {
    const cInt = (sumSub.netInt + i * compBlockIps) >>> 0;
    q.compSubnets.push(SubnetUtils.calc(SubnetUtils.intToIp(cInt), compP));
  }

  q.firstSub = q.compSubnets[0];
  q.lastSub = q.compSubnets[count - 1];

  // Changing octet where the k summarized bits sit:
  // Bits sumP+1 .. compP are in octet Math.floor(sumP / 8) + 1
  q.changeOctIdx = Math.floor(sumP / 8) + 1;
  const fOcts = SubnetUtils.getOctets(q.firstSub.network);
  const lOcts = SubnetUtils.getOctets(q.lastSub.broadcast);
  q.firstOctVal = fOcts[q.changeOctIdx - 1];
  q.lastOctVal = lOcts[q.changeOctIdx - 1];
  q.firstOctBin = SubnetUtils.byteToBin(q.firstOctVal);
  q.lastOctBin = SubnetUtils.byteToBin(q.lastOctVal);
  q.matchBitsInOctet = sumP % 8;

  q.answer = `${sumSub.network}/${sumP}`;
  q.acceptAnswers = [
    `${sumSub.network}/${sumP}`,
    `${sumSub.network} ${sumSub.mask}`
  ];
}

/**
 * 12. Cisco IOS Bad Mask & Gateway/Subnet Mismatch Troubleshooting Generator (Q14, Q16, Q53, Q109, Q506, Q1227)
 */
function buildTroubleshootQuestion(q, scope) {
  q.type = 'MCQ';
  const roll = Math.random();

  if (roll < 0.36) {
    // Scenario A: Cisco IOS "Bad mask /XX for address ..." (Q16)
    q.tsMode = 'BAD_MASK';
    q.optionsProse = true;

    const prefix = pickNonBoundaryPrefix(scope);
    const sub = SubnetUtils.calc(generateValidHostIP(prefix, false), prefix);
    q.isBroadcastErr = Math.random() < 0.55;
    q.badIp = q.isBroadcastErr ? sub.broadcast : sub.network;
    q.sub = sub;
    q.prefix = prefix;

    const reasonKeys = shuffle(['NET_ID', 'BROADCAST', 'NO_VLSM', 'RFC1918']);
    const winKey = q.isBroadcastErr ? 'BROADCAST' : 'NET_ID';
    const letters = ['A', 'B', 'C', 'D'];
    q.reasonOrder = reasonKeys;
    q.answer = letters[reasonKeys.indexOf(winKey)];
  } else if (roll < 0.76) {
    // Scenario B: Host-to-Gateway / Mask / Overlap Troubleshooting (Q53, Q506, Q1227)
    q.tsMode = 'MISMATCH';
    q.optionsProse = true;

    let rtrP;
    if (scope === 'CLASS_A') rtrP = randInt(10, 14);
    else if (scope === 'CLASS_B') rtrP = randInt(18, 22);
    else rtrP = randInt(25, 28); // block size >= 16 so lower/upper halves have plenty of hosts

    const sub = SubnetUtils.calc(generateValidHostIP(rtrP, false), rtrP);
    const blockIps = SubnetUtils.blockCountIps(rtrP);
    const tighterSub = SubnetUtils.calc(sub.network, rtrP + 1); // lower half only!

    q.rtrSub = sub;
    q.rtrP = rtrP;
    q.faultType = pick(['PC_MASK', 'PC_GW', 'PC_IP', 'RTR_OVERLAP']);

    if (q.faultType === 'PC_MASK') {
      // R1 Gi0/0 is at lastHost (upper half); PC1 IP is in lower half; PC1 mask is /rtrP+1 -> isolates gateway! (Q1227)
      q.rtrIp = sub.lastHost;
      q.pcIp = SubnetUtils.intToIp((sub.netInt + 3) >>> 0);
      q.pcMask = tighterSub.mask;
      q.pcP = rtrP + 1;
      q.pcGw = sub.lastHost;
      q.rtrGi01 = null;
    } else if (q.faultType === 'PC_GW') {
      // PC1 IP and mask match R1 Gi0/0, but PC1 Default Gateway points to an IP in the next subnet!
      q.rtrIp = sub.firstHost;
      q.pcIp = SubnetUtils.intToIp((sub.netInt + 5) >>> 0);
      q.pcMask = sub.mask;
      q.pcP = rtrP;
      q.pcGw = SubnetUtils.intToIp((sub.bcastInt + 2) >>> 0);
      q.rtrGi01 = null;
    } else if (q.faultType === 'PC_IP') {
      // R1 Gi0/0, PC1 Mask, and PC1 GW are all valid, but PC1 IP is assigned in the adjacent subnet!
      q.rtrIp = sub.firstHost;
      q.pcIp = SubnetUtils.intToIp((sub.bcastInt + 4) >>> 0);
      q.pcMask = sub.mask;
      q.pcP = rtrP;
      q.pcGw = sub.firstHost;
      q.rtrGi01 = null;
    } else {
      // R1 Gi0/1 overlaps with R1 Gi0/0 (Q53)!
      q.rtrIp = sub.firstHost;
      q.pcIp = SubnetUtils.intToIp((sub.netInt + 4) >>> 0);
      q.pcMask = sub.mask;
      q.pcP = rtrP;
      q.pcGw = sub.firstHost;
      const overlapIp = SubnetUtils.intToIp((sub.netInt + Math.floor(blockIps / 2) + 2) >>> 0);
      q.rtrGi01 = `${overlapIp}/${rtrP + 1}`;
    }

    q.pcSub = SubnetUtils.calc(q.pcIp, q.pcP);
    const fixKeys = shuffle(['PC_MASK', 'PC_GW', 'PC_IP', 'RTR_OVERLAP']);
    const letters = ['A', 'B', 'C', 'D'];
    q.fixOrder = fixKeys;
    q.answer = letters[fixKeys.indexOf(q.faultType)];
  } else {
    // Scenario C: Valid Interface IP + Mask Selection (Q14 /30 P2P or Q109 Last Usable IP)
    q.tsMode = 'VALID_CLI';
    q.optionsProse = false;
    q.isP2P30 = (scope === 'ALL' || scope === 'CLASS_C') && Math.random() < 0.48;

    const p = q.isP2P30 ? 30 : pickNonBoundaryPrefix(scope);
    const sub = SubnetUtils.calc(generateValidHostIP(p, false), p);
    const wrongMaskSub = SubnetUtils.calc(sub.network, p === 30 ? 29 : Math.min(30, p + 1));
    q.sub = sub;
    q.prefix = p;

    let rawOpts;
    if (q.isP2P30) {
      const winHost = Math.random() < 0.5 ? sub.firstHost : sub.lastHost;
      rawOpts = [
        { isWin: true, text: `ip address ${winHost} ${sub.mask}` },
        { isWin: false, text: `ip address ${sub.broadcast} ${sub.mask}` },
        { isWin: false, text: `ip address ${sub.network} ${sub.mask}` },
        { isWin: false, text: `ip address ${winHost} ${wrongMaskSub.mask}` }
      ];
    } else {
      rawOpts = [
        { isWin: true, text: `ip address ${sub.lastHost} ${sub.mask}` },
        { isWin: false, text: `ip address ${sub.broadcast} ${sub.mask}` },
        { isWin: false, text: `ip address ${sub.firstHost} ${sub.mask}` },
        { isWin: false, text: `ip address ${sub.lastHost} ${wrongMaskSub.mask}` }
      ];
    }
    const letters = ['A', 'B', 'C', 'D'];
    q.cliOpts = shuffle(rawOpts).map((o, idx) => {
      if (o.isWin) {
        q.answer = letters[idx];
        q.winCmd = o.text;
      }
      return { letter: letters[idx], text: o.text };
    });
  }
}

/**
 * Populate Localized Prompt, Options & Step-by-Step Explanation (Reactive i18n)
 */
function populateQuestionTexts(q) {
  const t = getT();
  q.placeholder = t.placeholders[q.placeholderKey] || t.placeholders.ip;

  switch (q.category) {
    case 'NET_ID':
      q.badge = t.categories.NET_ID;
      q.prompt = t.questions.NET_ID(q.ip, q.prefix);
      q.answer = q.sub.network;
      q.answerDisplay = q.sub.network;
      q.acceptAnswers = [q.sub.network];
      q.explanation = generateMagicExplanation(q.sub, 'network', q.isTrickyHostEdge);
      break;

    case 'BROADCAST':
      q.badge = t.categories.BROADCAST;
      q.prompt = t.questions.BROADCAST(q.ip, q.prefix);
      q.answer = q.sub.broadcast;
      q.answerDisplay = q.sub.broadcast;
      q.acceptAnswers = [q.sub.broadcast];
      q.explanation = generateMagicExplanation(q.sub, 'broadcast', q.isTrickyHostEdge);
      break;

    case 'HOST_BOUNDS':
      q.badge = t.categories.HOST_BOUNDS;
      if (q.boundType === 'FIRST') {
        q.prompt = t.questions.FIRST_HOST(q.ip, q.prefix);
        q.answer = q.sub.firstHost;
        q.explanation = generateMagicExplanation(q.sub, 'firstHost', q.isTrickyHostEdge);
      } else if (q.boundType === 'LAST') {
        q.prompt = t.questions.LAST_HOST(q.ip, q.prefix);
        q.answer = q.sub.lastHost;
        q.explanation = generateMagicExplanation(q.sub, 'lastHost', q.isTrickyHostEdge);
      } else {
        q.prompt = t.questions.SECOND_LAST_HOST(q.ip, q.prefix);
        q.answer = q.sub.secondLastHost;
        q.explanation = generateMagicExplanation(q.sub, 'secondLastHost', q.isTrickyHostEdge);
      }
      q.answerDisplay = q.answer;
      q.acceptAnswers = [q.answer];
      break;

    case 'MASK_CONVERT': {
      q.badge = t.categories.MASK_CONVERT;
      const fullOctets = Math.floor(q.prefix / 8);
      const remBits = q.prefix % 8;
      const octDec = fullOctets < 4 ? SubnetUtils.getOctets(q.sub.mask)[fullOctets] : 255;
      const octBin = SubnetUtils.byteToBin(octDec);

      if (q.convMode === 'CIDR_TO_MASK') {
        q.prompt = t.questions.CIDR_TO_MASK(q.prefix);
        q.answer = q.sub.mask;
        q.answerDisplay = q.sub.mask;
        q.acceptAnswers = [q.sub.mask];
      } else if (q.convMode === 'MASK_TO_CIDR') {
        q.prompt = t.questions.MASK_TO_CIDR(q.sub.mask);
        q.answer = `/${q.prefix}`;
        q.answerDisplay = `/${q.prefix}`;
        q.acceptAnswers = [`${q.prefix}`, `/${q.prefix}`];
      } else {
        q.prompt = t.questions.BIN_TO_CIDR(q.sub.binaryMask);
        q.answer = `/${q.prefix}`;
        q.answerDisplay = `/${q.prefix} (${q.sub.mask})`;
        q.acceptAnswers = [`${q.prefix}`, `/${q.prefix}`];
      }

      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.maskBin}</span><code>${q.sub.binaryMask}</code></div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.formula}</span>${t.explanations.maskBinBreakdown(fullOctets, remBits, octBin, octDec, q.sub.mask, q.prefix)}</div>
      `;
      break;
    }

    case 'VALID_HOSTS':
      q.badge = t.categories.VALID_HOSTS;
      if (q.countMode === 'HOSTS') {
        const h = 32 - q.prefix;
        q.prompt = t.questions.VALID_HOSTS(q.prefix, q.sub.mask);
        q.answer = q.sub.usableHosts.toString();
        q.answerDisplay = q.sub.usableHosts.toLocaleString();
        q.acceptAnswers = [q.sub.usableHosts.toString()];
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.hostBits}</span>${t.explanations.validHostsH(q.prefix, h)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.formula}</span>${t.explanations.validHostsFormula(h, q.sub.usableHosts.toLocaleString())}</div>
        `;
      } else {
        q.prompt = t.questions.SUBNET_COUNT(q.baseSub.network, q.baseP, q.newSub.mask, q.newP);
        q.answer = q.subnetCount.toString();
        q.answerDisplay = q.subnetCount.toString();
        q.acceptAnswers = [q.subnetCount.toString()];
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.subnetBits}</span>${t.explanations.subnetCountS(q.baseP, q.newP, q.borrowBits)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.formula}</span>${t.explanations.subnetCountFormula(q.borrowBits, q.subnetCount, q.newSub.usableHosts.toLocaleString())}</div>
        `;
      }
      break;

    case 'SAME_SUBNET': {
      q.badge = t.categories.SAME_SUBNET;
      q.prompt = t.questions.SAME_SUBNET(q.ip, q.host2Ip, q.prefix);
      q.answer = q.isSame ? 'YES' : 'NO';
      q.answerDisplay = q.isSame ? t.choiceYes : t.choiceNo;
      const host2Sub = SubnetUtils.calc(q.host2Ip, q.prefix);
      const octName = t.octets[q.sub.octetIndex - 1];
      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.magicNumber}</span>/${q.prefix} (${q.sub.mask}) ➔ ${octName}: 256 - ${q.sub.maskOctetVal} = <strong>${q.sub.magicNumber}</strong></div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.hostA}</span>${t.explanations.sameSubnetHostA(q.sub.network, q.prefix, q.sub.broadcast)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.hostB}</span>${t.explanations.sameSubnetHostB(host2Sub.network, q.prefix, host2Sub.broadcast)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.sameResult}</span>${q.isSame ? t.explanations.sameSubnetYes : t.explanations.sameSubnetNo}</div>
      `;
      break;
    }

    case 'LPM_ROUTING': {
      q.badge = t.categories.LPM_ROUTING;
      if (q.lpmMode === 'STATIC_CMD') {
        q.prompt = t.questions.LPM_STATIC_CMD(q.destIp);
        q.options = q.routes.map(r => ({ key: r.letter, text: r.staticCmd }));
      } else {
        const cliBlock = `<pre class="cli-exhibit"><span class="cli-muted">Router# show ip route</span>\n` +
          q.routes.map(r => escapeHtml(r.tableLine)).join('\n') + `</pre>`;
        q.prompt = t.questions.LPM_TABLE(q.destIp, cliBlock);
        q.options = q.routes.map(r => ({ key: r.letter, text: r.displayLine }));
      }
      q.answerDisplay = `[${q.answer}] ${q.winRouteDisplay}`;

      const evalHtml = q.routes.map(r => {
        const shortRoute = `${r.net}/${r.prefix} (${r.proto} ${r.adMetric})`;
        const rangeStr = `${r.net} ~ ${r.bc}`;
        if (r.isDefault) {
          return `<div class="eval-item ${r.isWinner ? 'win' : ''}">${t.explanations.lpmDefaultLine(r.letter, shortRoute, r.isWinner)}</div>`;
        }
        if (r.matches) {
          return `<div class="eval-item ${r.isWinner ? 'win' : ''}">${t.explanations.lpmMatchLine(r.letter, shortRoute, rangeStr, r.prefix, r.isWinner)}</div>`;
        }
        return `<div class="eval-item miss">${t.explanations.lpmMissLine(r.letter, shortRoute, rangeStr, q.destIp)}</div>`;
      }).join('');

      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.lpmRule}</span>${t.explanations.lpmRuleText}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.routeEval}</span><div class="eval-list">${evalHtml}</div></div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.lpmWinner}</span>${t.explanations.lpmWinnerText(q.answer, q.winRouteDisplay, q.reasonMode)}</div>
      `;
      break;
    }

    case 'SIM_SUBNET_LAB': {
      q.badge = t.categories.SIM_SUBNET_LAB;
      const nthStr = t.ordinal(q.nth);
      const octName = t.octets[q.targetSub.octetIndex - 1];
      if (q.simMode === 'SITES') {
        q.prompt = t.questions.SIM_SITES(q.baseNet, q.baseP, q.numSites, nthStr, q.isFirst, q.iface);
      } else {
        q.prompt = t.questions.SIM_NEXT_AVAIL(q.baseNet, q.baseP, q.newP, q.unavailStr, q.isFirst, q.routerName);
      }
      q.answerDisplay = `${q.targetIp}/${q.newP} (${q.targetSub.mask})`;

      const subListHtml = q.subnetSamples.map((s, idx) => {
        const isTarget = idx === q.nth - 1;
        return `<div class="eval-item ${isTarget ? 'win' : ''}">#${idx + 1}: <strong>${s.network}/${q.newP}</strong> (${s.firstHost} ~ ${s.lastHost} | BC: ${s.broadcast})</div>`;
      }).join('');

      const step1Html = q.simMode === 'SITES'
        ? t.explanations.simBorrowText(q.numSites, q.s, q.twoPowS, q.baseP, q.newP, q.targetSub.mask)
        : t.explanations.simAvailText(q.baseP, q.newP, q.targetSub.mask, q.unavailStr);

      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.simBorrow}</span>${step1Html}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.simBlock}</span>${t.explanations.simBlockText(octName, q.targetSub.magicNumber)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.simSubnets}</span><div class="eval-list">${subListHtml}</div></div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.simTarget}</span>${t.explanations.simTargetText(nthStr, q.targetSub.network, q.targetSub.broadcast, q.targetSub.firstHost, q.targetSub.lastHost, q.answer)}</div>
      `;
      break;
    }

    case 'VLSM_DESIGN': {
      q.badge = t.categories.VLSM_DESIGN;
      if (q.vlsmMode === 'CLI_ALIGN') {
        const gNote = q.growthPct > 0 ? t.questions.vlsmGrowthNote(q.baseUsers, q.growthPct) : '';
        q.prompt = t.questions.VLSM_CLI_ALIGN(q.poolStr, q.totalHosts, gNote, q.isSvi);
        q.options = q.vlsmOpts.map(o => ({ key: o.letter, text: o.text }));
        q.answerDisplay = `[${q.answer}] ${q.winText}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.vlsmReq}</span>${t.explanations.vlsmReqText(q.totalHosts, q.h, q.usable, q.optP, q.alignedSub.mask)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.vlsmTrap}</span>${t.explanations.vlsmTrapAlignText(q.misalignedNet, q.optP, q.alignedSub.magicNumber, q.alignedSub.network)}</div>
        `;
      } else if (q.vlsmMode === 'LINK_GROWTH') {
        q.prompt = t.questions.VLSM_LINK_GROWTH(q.numRouters, q.extraIps, q.totalNeeded);
        q.options = q.vlsmOpts.map(o => ({ key: o.letter, text: o.text }));
        q.answerDisplay = `[${q.answer}] ${q.winText}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.vlsmCalc}</span>${t.explanations.vlsmLinkText(q.numRouters, q.extraIps, q.totalNeeded, q.optP, q.optSub.mask, q.optSub.usableHosts)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.fullRange}</span><strong>${q.optSub.network}/${q.optP}</strong>: ${q.optSub.firstHost} ~ ${q.optSub.lastHost} (BC: ${q.optSub.broadcast})</div>
        `;
      } else {
        const scenHtml = q.isFloorScenario
          ? t.questions.vlsmFloorScenario(q.floors, q.perFloor, q.totalHosts)
          : t.questions.vlsmGrowthScenario(q.curUsers, q.pct, q.totalHosts);
        q.prompt = t.questions.VLSM_MASK_INPUT(scenHtml);
        q.answerDisplay = `${q.optSub.mask} (/${q.optP})`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.vlsmReq}</span>${t.explanations.vlsmReqText(q.totalHosts, q.h, q.usable, q.optP, q.optSub.mask)}</div>
        `;
      }
      break;
    }

    case 'WILDCARD_ACL': {
      q.badge = t.categories.WILDCARD_ACL;
      if (q.wcMode === 'WC_CALC') {
        const octName = t.octets[q.sub.octetIndex - 1];
        q.prompt = t.questions.WC_CALC(q.sub.network, q.prefix, q.sub.mask, q.contextType);
        q.answerDisplay = q.sub.wildcard;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcFormula}</span>${t.explanations.wcCalcStep1(q.sub.mask, q.sub.wildcard)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.magicNumber}</span>${t.explanations.wcCalcStep2(octName, q.sub.magicNumber, q.sub.wcOctetVal)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcRange}</span>${t.explanations.wcRangeText(q.sub.network, q.sub.broadcast)}</div>
        `;
      } else if (q.wcMode === 'ACL_CLI') {
        q.prompt = t.questions.WC_ACL_CLI(q.srcSub.network, q.srcSub.prefix, q.dstSub.network, q.dstSub.prefix, q.svc.app, q.svc.port);
        q.options = q.wcOpts.map(o => ({ key: o.letter, text: o.text }));
        q.answerDisplay = `[${q.answer}] ${q.winText}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcSrc}</span>/${q.srcSub.prefix} ➔ ${t.explanations.wcCalcStep1(q.srcSub.mask, q.srcSub.wildcard)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcDst}</span>/${q.dstSub.prefix} ➔ ${t.explanations.wcCalcStep1(q.dstSub.mask, q.dstSub.wildcard)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcResult}</span><code>${q.winText}</code></div>
        `;
      } else {
        const cmdBlock = `<pre class="cli-exhibit">Router(config)# router ospf 1\nRouter(config-router)# <span class="cli-hl">network ${q.sub.network} ${q.sub.wildcard} area 0</span></pre>`;
        q.prompt = t.questions.WC_OSPF_IFACE(cmdBlock);
        q.options = q.ospfIfaces.map(o => ({ key: o.letter, text: o.text }));
        q.answerDisplay = `[${q.answer}] ${q.winText}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcFormula}</span>${t.explanations.wcCalcStep1(q.sub.mask, q.sub.wildcard)} (/${q.sub.prefix})</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcRange}</span>${t.explanations.wcRangeText(q.sub.network, q.sub.broadcast)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.wcResult}</span><strong>[${q.answer}] ${q.winText}</strong></div>
        `;
      }
      break;
    }

    case 'ROUTE_SUMMARY': {
      q.badge = t.categories.ROUTE_SUMMARY;
      const routesBlock = `<pre class="cli-exhibit">` +
        q.compSubnets.map(s => `• ${s.network}/${q.compP}  <span class="cli-muted">(${s.network} ~ ${s.broadcast})</span>`).join('\n') +
        `</pre>`;
      q.prompt = t.questions.ROUTE_SUMMARY(routesBlock, q.protoName);
      q.answerDisplay = `${q.sumSub.network}/${q.sumP} (${q.sumSub.mask})`;
      const octName = t.octets[q.changeOctIdx - 1];
      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.sumSpan}</span>${t.explanations.sumSpanText(q.firstSub.network, q.lastSub.broadcast, q.count, q.compP)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.sumBinary}</span>${t.explanations.sumBinText(octName, q.firstOctVal, q.firstOctBin, q.lastOctVal, q.lastOctBin, q.matchBitsInOctet)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.sumResult}</span>${t.explanations.sumResultText(q.sumSub.network, q.sumP, q.sumSub.mask)}</div>
      `;
      break;
    }

    case 'IP_TROUBLESHOOT': {
      q.badge = t.categories.IP_TROUBLESHOOT;
      const letters = ['A', 'B', 'C', 'D'];
      if (q.tsMode === 'BAD_MASK') {
        const cliBlock = `<pre class="cli-exhibit">R1(config)# interface GigabitEthernet0/1\nR1(config-if)# ip address ${q.badIp} ${q.sub.mask}\n<span class="cli-warn">Bad mask /${q.prefix} for address ${q.badIp}</span></pre>`;
        q.prompt = t.questions.TS_BAD_MASK(cliBlock);
        q.options = q.reasonOrder.map((rKey, idx) => {
          const text = rKey === 'NO_VLSM' ? t.mcqOptions.badMaskReasons.NO_VLSM(q.prefix) : t.mcqOptions.badMaskReasons[rKey];
          return { key: letters[idx], text };
        });
        const winOptObj = q.options.find(o => o.key === q.answer);
        q.answerDisplay = `[${q.answer}] ${winOptObj.text}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.tsAnalyze}</span>${t.explanations.tsBadMaskText(q.badIp, q.prefix, q.sub.mask, q.sub.magicNumber, q.sub.network, q.sub.broadcast, q.isBroadcastErr)}</div>
        `;
      } else if (q.tsMode === 'MISMATCH') {
        const extraLine = q.rtrGi01 ? `\nR1 Gi0/1 (VLAN2) : <span class="cli-warn">${q.rtrGi01}</span>` : '';
        const topoBlock = `<pre class="cli-exhibit">[PC1 Host Configuration]\n  IPv4 Address    : ${q.pcIp}\n  Subnet Mask     : ${q.pcMask} (/${q.pcP})\n  Default Gateway : ${q.pcGw}\n\n[Router R1 Configuration]\n  R1 Gi0/0 (LAN)  : <span class="cli-hl">${q.rtrIp}/${q.rtrP}</span> (${q.rtrSub.mask})${extraLine}</pre>`;
        q.prompt = t.questions.TS_GATEWAY_MISMATCH(topoBlock);
        const validRangeStr = `${q.rtrSub.firstHost} ~ ${q.rtrSub.lastHost}`;
        q.options = q.fixOrder.map((fKey, idx) => {
          let text;
          if (fKey === 'PC_MASK') text = t.mcqOptions.tsFixes.PC_MASK(q.rtrSub.mask);
          else if (fKey === 'PC_GW') text = t.mcqOptions.tsFixes.PC_GW(q.rtrIp);
          else if (fKey === 'PC_IP') text = t.mcqOptions.tsFixes.PC_IP(validRangeStr);
          else text = t.mcqOptions.tsFixes.RTR_OVERLAP;
          return { key: letters[idx], text };
        });
        const winOptObj = q.options.find(o => o.key === q.answer);
        q.answerDisplay = `[${q.answer}] ${winOptObj.text}`;
        const pcRange = `${q.pcSub.network} ~ ${q.pcSub.broadcast}`;
        const rtrRange = `${q.rtrSub.network} ~ ${q.rtrSub.broadcast}`;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.tsAnalyze}</span>${t.explanations.tsMismatchText(q.pcIp, q.pcMask, q.pcP, pcRange, q.rtrIp, q.rtrP, rtrRange, q.pcGw, q.faultType)}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.tsFix}</span><strong>[${q.answer}] ${winOptObj.text}</strong></div>
        `;
      } else {
        q.prompt = t.questions.TS_VALID_HOST_CLI(q.isP2P30);
        q.options = q.cliOpts.map(o => ({ key: o.letter, text: o.text }));
        q.answerDisplay = `[${q.answer}] ${q.winCmd}`;
        const detail = t.explanations.tsCliTrapDetail(q.sub.network, q.sub.broadcast, q.sub.firstHost, q.sub.lastHost, q.prefix);
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.tsAnalyze}</span>${detail}</div>
          <div class="magic-step"><span class="step-label">${t.stepLabels.tsFix}</span>${t.explanations.tsValidCliText(q.answer, q.winCmd, '')}</div>
        `;
      }
      break;
    }
  }
}

/**
 * Format step-by-step Magic Number explanation for core boundary calculations
 */
function generateMagicExplanation(sub, targetField, showTrickyHostNote) {
  const t = getT();
  const targetDesc = targetField === 'secondLastHost'
    ? t.explanations.targetDesc.secondLastHost(sub.secondLastHost, sub.lastHost)
    : t.explanations.targetDesc[targetField](sub[targetField]);

  const edgeNoteHtml = showTrickyHostNote
    ? `<div class="magic-step"><span class="step-label">${t.stepLabels.hostNote}</span>${t.explanations.trickyHostNote(sub.ip, sub.prefix, sub.network, sub.broadcast)}</div>`
    : '';

  if (sub.isBoundary) {
    return `
      <div class="magic-step"><span class="step-label">${t.stepLabels.boundary}</span>${t.explanations.boundaryStep1(sub.prefix, sub.mask)}</div>
      <div class="magic-step"><span class="step-label">${t.stepLabels.netHost}</span>${t.explanations.boundaryStep2(sub.prefix / 8)}</div>
      <div class="magic-step"><span class="step-label">${t.stepLabels.range}</span>${t.explanations.boundaryStep3(sub.network, sub.broadcast)}</div>
      ${edgeNoteHtml}
      <div class="magic-step"><span class="step-label">${t.stepLabels.result}</span>${targetDesc}</div>
    `;
  }

  const octetName = t.octets[sub.octetIndex - 1];
  const ipOctets = SubnetUtils.getOctets(sub.ip);
  const curOctetVal = ipOctets[sub.octetIndex - 1];
  const netOctets = SubnetUtils.getOctets(sub.network);
  const netOctetVal = netOctets[sub.octetIndex - 1];
  const factor = Math.floor(curOctetVal / sub.magicNumber);

  return `
    <div class="magic-step"><span class="step-label">${t.stepLabels.interestingOctet}</span>${t.explanations.magicStep1(sub.mask, octetName, sub.maskOctetVal)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.magicNumber}</span>${t.explanations.magicStep2(sub.maskOctetVal, sub.magicNumber)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.multiples}</span>${t.explanations.magicStep3(curOctetVal, netOctetVal, sub.magicNumber, factor)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.fullRange}</span>${t.explanations.magicStep4(sub.network, sub.broadcast)}</div>
    ${edgeNoteHtml}
    <div class="magic-step"><span class="step-label">${t.stepLabels.magicResult}</span>${targetDesc}</div>
  `;
}

/**
 * Normalize & Validate User Answers (Supports IP/CIDR, IP + Mask, Commas, Prefix Slashes)
 */
function normalizeTextInput(val) {
  let s = String(val || '').trim();
  // Remove thousands separators in numeric answers (e.g. "16,382" -> "16382")
  if (/^[\d,]+$/.test(s)) {
    return s.replace(/,/g, '');
  }
  // Normalize spaces around "/" (e.g. "10.1.40.0 / 23" -> "10.1.40.0/23")
  s = s.replace(/\s*\/\s*/g, '/');
  // Normalize multiple spaces to single space (for "IP MASK" syntax)
  s = s.replace(/\s+/g, ' ');
  return s.toUpperCase();
}

function checkIsCorrect(q, userVal) {
  if (userVal === null || userVal === undefined) return false;
  const norm = normalizeTextInput(userVal);
  if (!norm) return false;

  if (q.type === 'CHOICE' || q.type === 'MCQ') {
    return norm === q.answer.toUpperCase();
  }

  // Check against all accepted answer representations
  const accepted = (q.acceptAnswers && q.acceptAnswers.length > 0) ? q.acceptAnswers : [q.answer];
  for (let i = 0; i < accepted.length; i++) {
    if (norm === normalizeTextInput(accepted[i])) return true;
  }

  // Extra convenience: if user typed "IP DOTTED_MASK" when "IP/CIDR" was expected
  const parts = norm.split(' ');
  if (parts.length === 2 && SubnetUtils.isValidIpv4(parts[0])) {
    const p = SubnetUtils.maskStrToPrefix(parts[1]);
    if (p !== null) {
      const asCidr = `${parts[0]}/${p}`;
      for (let i = 0; i < accepted.length; i++) {
        if (asCidr === normalizeTextInput(accepted[i])) return true;
      }
    }
  }
  return false;
}

/**
 * Render MCQ Option Buttons (A / B / C / D)
 */
function renderMcqOptions(q) {
  const mcqGroup = document.getElementById('mcqGroup');
  if (!mcqGroup || q.type !== 'MCQ' || !q.options) return;

  mcqGroup.innerHTML = q.options.map(opt => {
    let stateCls = '';
    if (state.answered) {
      stateCls = 'locked';
      if (opt.key === q.answer) {
        stateCls += ' correct';
      } else if (state.lastResult && !state.lastResult.isRevealed && state.lastResult.userVal === opt.key) {
        stateCls += ' wrong';
      }
    }
    return `
      <button type="button" class="mcq-btn ${stateCls}" data-opt="${opt.key}">
        <span class="mcq-key">${opt.key}</span>
        <span class="mcq-text ${q.optionsProse ? 'prose' : ''}">${escapeHtml(opt.text)}</span>
      </button>
    `;
  }).join('');

  mcqGroup.querySelectorAll('.mcq-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!state.answered) {
        state.answeredAt = Date.now();
        handleAnswer(btn.getAttribute('data-opt'));
      }
    });
  });
}

function updateChoiceButtonStates(q) {
  document.querySelectorAll('.choice-btn').forEach(btn => {
    const c = btn.getAttribute('data-choice');
    btn.classList.remove('correct', 'wrong', 'locked');
    if (state.answered && q.type === 'CHOICE') {
      btn.classList.add('locked');
      if (c === q.answer) {
        btn.classList.add('correct');
      } else if (state.lastResult && !state.lastResult.isRevealed && state.lastResult.userVal === c) {
        btn.classList.add('wrong');
      }
    }
  });
}

/**
 * Load & Render New Question
 */
function loadNewQuestion() {
  const t = getT();
  state.answered = false;
  state.lastResult = null;
  state.currentQuestion = createQuestion();

  const q = state.currentQuestion;
  document.getElementById('qTypeBadge').textContent = q.badge;
  document.getElementById('qPrompt').innerHTML = q.prompt;

  // Reset answer box and input state (preserving viewport stability)
  document.getElementById('answerBox').style.display = 'none';
  const inputEl = document.getElementById('answerInput');
  inputEl.readOnly = false;
  inputEl.value = '';
  inputEl.className = '';
  inputEl.placeholder = q.placeholder;

  const textRow = document.getElementById('textInputRow');
  const choiceGroup = document.getElementById('choiceGroup');
  const mcqGroup = document.getElementById('mcqGroup');
  const mode = document.getElementById('modeSelect').value;

  updateChoiceButtonStates(q);

  if (q.type === 'MCQ') {
    textRow.style.display = 'none';
    choiceGroup.style.display = 'none';
    mcqGroup.style.display = 'flex';
    renderMcqOptions(q);
  } else if (q.type === 'CHOICE') {
    textRow.style.display = 'none';
    mcqGroup.style.display = 'none';
    choiceGroup.style.display = mode === 'FLASHCARD' ? 'none' : 'flex';
  } else {
    choiceGroup.style.display = 'none';
    mcqGroup.style.display = 'none';
    if (mode === 'FLASHCARD') {
      textRow.style.display = 'none';
    } else {
      textRow.style.display = 'flex';
      inputEl.focus();
    }
  }

  document.getElementById('revealBtn').textContent = (mode === 'FLASHCARD')
    ? t.revealBtnFlashcard
    : t.revealBtnPractice;

  // Stopwatch handling (disabled by default)
  clearInterval(state.timerInterval);
  const timerBadge = document.getElementById('timerDisplay');
  const timerVal = document.getElementById('timerVal');

  if (state.timerEnabled) {
    timerBadge.classList.add('active');
    state.startTime = Date.now();
    timerVal.textContent = '0.0s';
    state.timerInterval = setInterval(() => {
      const elapsed = ((Date.now() - state.startTime) / 1000).toFixed(1);
      timerVal.textContent = `${elapsed}s`;
    }, 100);
  } else {
    timerBadge.classList.remove('active');
    timerVal.textContent = t.timerDisplayOff;
  }
}

/**
 * Evaluate User Answer & Expand Step-by-Step Breakdown
 */
function handleAnswer(userVal) {
  if (state.answered) return;
  state.answered = true;
  state.answeredAt = Date.now();
  clearInterval(state.timerInterval);

  const t = getT();
  const q = state.currentQuestion;
  const isRevealed = (userVal === null);
  const isCorrect = !isRevealed && checkIsCorrect(q, userVal);

  state.lastResult = {
    isRevealed,
    isCorrect,
    userVal
  };

  state.stats.total++;
  if (isCorrect) {
    state.stats.correct++;
    state.stats.streak++;
  } else {
    state.stats.streak = 0;
  }
  updateStatsUI();

  const resultStatus = document.getElementById('resultStatus');
  const inputEl = document.getElementById('answerInput');

  if (isRevealed) {
    resultStatus.innerHTML = `<span class="result-badge" style="background:#475569; color:#f8fafc;">${t.resRevealed}</span>`;
  } else if (isCorrect) {
    resultStatus.innerHTML = `<span class="result-badge result-correct">${t.resCorrect}</span>`;
    if (q.type === 'TEXT') inputEl.classList.add('correct');
  } else {
    resultStatus.innerHTML = `<span class="result-badge result-wrong">${t.resWrong.replace('{val}', escapeHtml(userVal))}</span>`;
    if (q.type === 'TEXT') inputEl.classList.add('wrong');
  }

  if (q.type === 'MCQ') renderMcqOptions(q);
  if (q.type === 'CHOICE') updateChoiceButtonStates(q);

  document.getElementById('targetAnswer').textContent = q.answerDisplay || q.answer;
  document.getElementById('targetAnswerLabel').textContent = t.targetAnswerLabel;
  document.getElementById('ccnaBreakdown').innerHTML = q.explanation;
  document.getElementById('answerBox').style.display = 'block';

  // Lock input in place without auto-focusing bottom buttons (zero viewport jump)
  if (inputEl) {
    inputEl.readOnly = true;
    inputEl.blur();
  }
}

function updateStatsUI() {
  document.getElementById('statStreak').textContent = state.stats.streak;
  document.getElementById('statTotal').textContent = state.stats.total;
  const acc = state.stats.total > 0 ? Math.round((state.stats.correct / state.stats.total) * 100) : 0;
  document.getElementById('statAccuracy').textContent = `${acc}%`;
}

  }
  const bodyEl = document.getElementById('cheatTableBody');
  if (bodyEl) {
    bodyEl.innerHTML = t.cheatRows.map(row => `
      <tr>
        <td><code>${row[0]}</code></td>
        <td><strong>${row[1]}</strong></td>
        <td><strong>${row[2]}</strong></td>
        <td><code>${row[3]}</code></td>
        <td>${row[4]}</td>
      </tr>
    `).join('');
  }

  const timerBtn = document.getElementById('timerToggleBtn');
  if (state.timerEnabled) {
    timerBtn.textContent = t.timerBtnOn;
    timerBtn.classList.add('active');
  } else {
    timerBtn.textContent = t.timerBtnOff;
    timerBtn.classList.remove('active');
    const timerVal = document.getElementById('timerVal');
    if (timerVal) timerVal.textContent = t.timerDisplayOff;
  }

  // Refresh dropdown options while preserving current selections
  const catSel = document.getElementById('categorySelect');
  const curCat = catSel.value || 'ALL';
  catSel.innerHTML = Object.entries(t.categories)
    .map(([k, v]) => `<option value="${k}" ${k === curCat ? 'selected' : ''}>${v}</option>`)
    .join('');

  const scopeSel = document.getElementById('prefixScope');
  const curScope = scopeSel.value || 'ALL';
  scopeSel.innerHTML = Object.entries(t.scopes)
    .map(([k, v]) => `<option value="${k}" ${k === curScope ? 'selected' : ''}>${v}</option>`)
    .join('');

  const modeSel = document.getElementById('modeSelect');
  const curMode = modeSel.value || 'INPUT';
  modeSel.innerHTML = Object.entries(t.modes)
    .map(([k, v]) => `<option value="${k}" ${k === curMode ? 'selected' : ''}>${v}</option>`)
    .join('');

  const revealBtn = document.getElementById('revealBtn');
  if (revealBtn) {
    revealBtn.textContent = (curMode === 'FLASHCARD') ? t.revealBtnFlashcard : t.revealBtnPractice;
  }

  if (state.answered && state.lastResult) {
    const resultStatus = document.getElementById('resultStatus');
    if (resultStatus) {
      if (state.lastResult.isRevealed) {
        resultStatus.innerHTML = `<span class="result-badge" style="background:#475569; color:#f8fafc;">${t.resRevealed}</span>`;
      } else if (state.lastResult.isCorrect) {
        resultStatus.innerHTML = `<span class="result-badge result-correct">${t.resCorrect}</span>`;
      } else {
        resultStatus.innerHTML = `<span class="result-badge result-wrong">${t.resWrong.replace('{val}', escapeHtml(state.lastResult.userVal))}</span>`;
      }
    }
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === state.lang);
  });
}

/**
 * Switch Active Language & Re-Render Current Question In Place
 */
function setLanguage(lang) {
  if (state.lang === lang) return;
  state.lang = lang;
  updateLanguageUI();

  if (state.currentQuestion) {
    const q = state.currentQuestion;
    populateQuestionTexts(q);
    document.getElementById('qTypeBadge').textContent = q.badge;
    document.getElementById('qPrompt').innerHTML = q.prompt;
    document.getElementById('answerInput').placeholder = q.placeholder;
    document.getElementById('targetAnswer').textContent = q.answerDisplay || q.answer;
    document.getElementById('ccnaBreakdown').innerHTML = q.explanation;
    if (q.type === 'MCQ') renderMcqOptions(q);
    if (q.type === 'CHOICE') updateChoiceButtonStates(q);
  } else {
    loadNewQuestion();
  }
}

/**
 * Toggle Optional Stopwatch Timer
 */
function toggleTimer() {
  state.timerEnabled = !state.timerEnabled;
  const t = getT();
  const timerBtn = document.getElementById('timerToggleBtn');
  const timerBadge = document.getElementById('timerDisplay');
  const timerVal = document.getElementById('timerVal');

  if (state.timerEnabled) {
    timerBtn.textContent = t.timerBtnOn;
    timerBtn.classList.add('active');
    timerBadge.classList.add('active');
    state.startTime = Date.now();
    timerVal.textContent = '0.0s';
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      const elapsed = ((Date.now() - state.startTime) / 1000).toFixed(1);
      timerVal.textContent = `${elapsed}s`;
    }, 100);
  } else {
    timerBtn.textContent = t.timerBtnOff;
    timerBtn.classList.remove('active');
    timerBadge.classList.remove('active');
    clearInterval(state.timerInterval);
    timerVal.textContent = t.timerDisplayOff;
  }
}

/**
 * Event Listeners & Keyboard Shortcuts
 */
document.getElementById('submitBtn').addEventListener('click', () => {
  handleAnswer(document.getElementById('answerInput').value);
});

document.getElementById('revealBtn').addEventListener('click', () => {
  handleAnswer(null);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  loadNewQuestion();
});

document.getElementById('timerToggleBtn').addEventListener('click', toggleTimer);

document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    if (!state.answered) {
      state.answeredAt = Date.now();
      handleAnswer(e.currentTarget.getAttribute('data-choice'));
    }
  });
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    setLanguage(e.currentTarget.getAttribute('data-lang'));
  });
});

document.getElementById('categorySelect').addEventListener('change', loadNewQuestion);
document.getElementById('prefixScope').addEventListener('change', loadNewQuestion);
document.getElementById('modeSelect').addEventListener('change', loadNewQuestion);

document.getElementById('cheatSheetToggle').addEventListener('click', () => {
  const content = document.getElementById('cheatSheetContent');
  const arrow = document.getElementById('cheatArrow');
  const t = getT();
  if (content.style.display === 'block') {
    content.style.display = 'none';
    arrow.textContent = t.cheatOpen;
  } else {
    content.style.display = 'block';
    arrow.textContent = t.cheatClose;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const now = Date.now();
  const q = state.currentQuestion;
  const isTyping = (document.activeElement === document.getElementById('answerInput'));

  if (e.key === 'Enter') {
    e.preventDefault();
    if (state.answered) {
      // 350ms debounce prevents a single Enter press from skipping the explanation
      if (now - (state.answeredAt || 0) > 350) {
        loadNewQuestion();
      }
    } else if (q && q.type === 'TEXT') {
      state.answeredAt = now;
      handleAnswer(document.getElementById('answerInput').value);
    }
    return;
  }

  if (e.code === 'Space' && !isTyping) {
    e.preventDefault();
    if (!state.answered) {
      handleAnswer(null);
    } else if (now - (state.answeredAt || 0) > 350) {
      loadNewQuestion();
    }
    return;
  }

  // Keyboard shortcuts [A-D] or [1-4] for Multiple Choice & [Y/N] for Binary Choice
  if (!state.answered && !isTyping && q) {
    const keyUpper = e.key.toUpperCase();
    if (q.type === 'MCQ') {
      const mapNum = { '1': 'A', '2': 'B', '3': 'C', '4': 'D' };
      const picked = ['A', 'B', 'C', 'D'].includes(keyUpper) ? keyUpper : mapNum[e.key];
      if (picked) {
        e.preventDefault();
        state.answeredAt = now;
        handleAnswer(picked);
      }
    } else if (q.type === 'CHOICE') {
      if (keyUpper === 'Y' || e.key === '1') {
        e.preventDefault();
        state.answeredAt = now;
        handleAnswer('YES');
      } else if (keyUpper === 'N' || e.key === '2') {
        e.preventDefault();
        state.answeredAt = now;
        handleAnswer('NO');
      }
    }
  }
});

// Initialize Application (Default: Japanese, Timer OFF)
updateLanguageUI();
loadNewQuestion();

</script>

</html>
