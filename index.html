<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCNA Subnet Master v2.2.0 - サブネット計算特訓</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      --tag-bg: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
    }

    .container {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* 顶部导航与语言/统计 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* 语言切换器 */
    .lang-switcher {
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.35rem 0.65rem;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .lang-btn:hover { color: var(--text-main); }
    .lang-btn.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
    }

    /* 战绩统计 */
    .stats-bar {
      display: flex;
      gap: 1rem;
      background: var(--card-bg);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; }
    .stat-val { font-weight: bold; font-size: 1.05rem; }
    .stat-val.streak { color: var(--warning); }
    .stat-val.accuracy { color: var(--success); }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); }

    /* 控制面板 */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      background: var(--card-bg);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    label { color: var(--text-muted); }
    select, button.btn-secondary {
      background: var(--bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:focus { border-color: var(--accent); }
    button.btn-secondary:hover { border-color: var(--text-muted); }
    button.btn-secondary.active {
      border-color: var(--warning);
      color: var(--warning);
    }

    /* 题目卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .q-category {
      background: var(--tag-bg);
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-weight: 500;
    }
    .timer-badge {
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .timer-badge.active { color: var(--warning); }
    .q-prompt {
      font-size: 1.35rem;
      line-height: 1.6;
      font-weight: 600;
    }
    .highlight-ip {
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
    }

    /* 答题交互区 */
    .interaction-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .input-row {
      display: flex;
      gap: 0.75rem;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 1.15rem;
      font-family: monospace;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
    }
    input[type="text"].wrong { border-color: var(--danger); }
    input[type="text"].correct { border-color: var(--success); }

    .btn-primary {
      background: var(--accent);
      flex-shrink: 0;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-reveal {
      background: transparent;
      color: var(--text-muted);
      border: 1px dashed var(--card-border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      align-self: flex-start;
    }
    .btn-reveal:hover { color: var(--text-main); border-color: var(--text-muted); }

    /* 选择题按钮 */
    .choice-group {
      display: flex;
      gap: 1rem;
    }
    .choice-btn {
      flex: 1;
      background: var(--bg);
      border: 2px solid var(--card-border);
      color: var(--text-main);
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .choice-btn:hover { border-color: var(--accent); }

    /* 答案与 CCNA 解析区域 */
    .answer-box {
      border-top: 1px solid var(--card-border);
      padding-top: 1.25rem;
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .result-badge {
      display: inline-block;
      font-weight: bold;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    .result-correct { background: rgba(52, 211, 153, 0.2); color: var(--success); }
    .result-wrong { background: rgba(248, 113, 113, 0.2); color: var(--danger); }
    .correct-answer-text {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    /* CCNA 专属解析板 (Magic Number) */
    .ccna-breakdown {
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .magic-step {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .step-label {
      color: var(--accent);
      font-weight: bold;
      min-width: 140px;
    }

    /* 底部按钮栏 */
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* CCNA 速记表折叠面板 */
    .cheat-sheet-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }
    .cheat-sheet-header {
      padding: 0.75rem 1rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
    }
    .cheat-sheet-content {
      padding: 1rem;
      border-top: 1px solid var(--card-border);
      display: none;
      overflow-x: auto;
    }
    table.cheat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: center;
    }
    table.cheat-table th, table.cheat-table td {
      border: 1px solid var(--card-border);
      padding: 0.4rem 0.5rem;
    }
    table.cheat-table th { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
    table.cheat-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

    .shortcut-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }


    /* 移动端响应式适配 (防横向溢出与布局优化) */
    @media (max-width: 640px) {
      body {
        padding: 0.75rem 0.5rem 2rem;
      }
      .container {
        gap: 0.85rem;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }
      .header-left {
        justify-content: space-between;
      }
      .header-right {
        justify-content: space-between;
        width: 100%;
        gap: 0.5rem;
      }
      .lang-switcher {
        flex-shrink: 0;
      }
      .stats-bar {
        flex: 1;
        justify-content: space-around;
        padding: 0.35rem 0.5rem;
        gap: 0.5rem;
      }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
        padding: 0.75rem;
      }
      .control-group {
        width: 100%;
        justify-content: space-between;
      }
      .control-group select {
        flex: 1;
        max-width: 200px;
      }
      .card {
        padding: 1.25rem 1rem;
        gap: 1.25rem;
        border-radius: 10px;
      }
      .q-prompt {
        font-size: 1.15rem;
        line-height: 1.5;
      }
      /* 手机版输入框与提交按钮垂直排列，完美防止向右溢出 */
      .input-row {
        flex-direction: column;
        width: 100%;
        gap: 0.65rem;
      }
      input[type="text"] {
        width: 100%;
        min-width: 0;
        padding: 0.75rem 0.85rem;
        font-size: 1.05rem;
      }
      .btn-primary {
        width: 100%;
        padding: 0.8rem 1rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-reveal {
        width: 100%;
        text-align: center;
        padding: 0.65rem 1rem;
      }
      .choice-group {
        flex-direction: column;
        gap: 0.65rem;
      }
      .action-row {
        width: 100%;
      }
      .action-row .btn-primary {
        width: 100%;
      }
      .magic-step {
        flex-direction: column;
        gap: 0.2rem;
      }
      .step-label {
        min-width: auto;
      }
      .cheat-sheet-content {
        padding: 0.5rem;
      }
      table.cheat-table {
        font-size: 0.72rem;
      }
      table.cheat-table th, table.cheat-table td {
        padding: 0.35rem 0.2rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 头部：标题、统计、语言切换 -->
  <header>
    <div class="header-left">
      <h1>Subnet Master <span class="badge" id="appBadge">CCNA サブネット特訓 v2.2</span></h1>
    </div>
    <div class="header-right">
      <!-- 语言选择按钮组 (默认日语) -->
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>

      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-val streak" id="statStreak">0</span>
          <span class="stat-label" id="labelStreak">連続正解</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="statTotal">0</span>
          <span class="stat-label" id="labelTotal">回答数</span>
        </div>
        <div class="stat-item">
          <span class="stat-val accuracy" id="statAccuracy">0%</span>
          <span class="stat-label" id="labelAccuracy">正答率</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 设置与过滤栏 -->
  <div class="controls">
    <div class="control-group">
      <label for="categorySelect" id="labelCategory">出題タイプ：</label>
      <select id="categorySelect">
        <!-- 选项由 JS 动态本地化注入 -->
      </select>
    </div>

    <div class="control-group">
      <label for="prefixScope" id="labelScope">プレフィックス範囲：</label>
      <select id="prefixScope">
        <!-- 选项由 JS 动态本地化注入 -->
      </select>
    </div>

    <div class="control-group">
      <label for="modeSelect" id="labelMode">モード：</label>
      <select id="modeSelect">
        <!-- 选项由 JS 动态本地化注入 -->
      </select>
    </div>

    <!-- 计时器开关 (默认关闭) -->
    <div class="control-group">
      <button class="btn-secondary" id="timerToggleBtn">⏱ タイマー: OFF</button>
    </div>
  </div>

  <!-- 主题目卡片 -->
  <div class="card">
    <div class="q-meta">
      <span class="q-category" id="qTypeBadge">サブネット計算</span>
      <span class="timer-badge" id="timerDisplay">⏱ <span id="timerVal">OFF</span></span>
    </div>

    <div class="q-prompt" id="qPrompt">
      読み込み中...
    </div>

    <!-- 交互输入区 -->
    <div class="interaction-area" id="interactionArea">
      <!-- 填空输入模式 -->
      <div class="input-row" id="textInputRow">
        <input type="text" id="answerInput" placeholder="回答を入力してEnter (例: 192.168.1.0)" autocomplete="off" spellcheck="false">
        <button class="btn-primary" id="submitBtn">送信 (Enter)</button>
      </div>

      <!-- 选择题模式 (Yes / No) -->
      <div class="choice-group" id="choiceGroup" style="display: none;">
        <button class="choice-btn" id="choiceBtnYes" data-choice="YES">はい (同一サブネット)</button>
        <button class="choice-btn" id="choiceBtnNo" data-choice="NO">いいえ (別サブネット)</button>
      </div>

      <button class="btn-reveal" id="revealBtn">🤔 解説を見る (またはSpace)</button>
    </div>

    <!-- 结果与 CCNA 考点解析 -->
    <div class="answer-box" id="answerBox">
      <div id="resultStatus"></div>
      <div class="correct-answer-text">
        <span id="targetAnswerLabel">正解:</span> <span class="highlight-ip" id="targetAnswer"></span>
      </div>

      <div class="ccna-breakdown" id="ccnaBreakdown">
        <!-- 动态注入解析推导 -->
      </div>

      <div class="action-row" style="margin-top: 1.25rem;">
        <button class="btn-primary" id="nextBtn">次の問題 (Enter)</button>
      </div>
    </div>
  </div>

  <!-- CCNA 必备：速记魔术数字口诀表 -->
  <div class="cheat-sheet-card">
    <div class="cheat-sheet-header" id="cheatSheetToggle">
      <span id="cheatSheetTitle">📖 CCNA 必須：マジックナンバー (Magic Number) 速算・借用ビット表</span>
      <span id="cheatArrow">▼ クリックして展開</span>
    </div>
    <div class="cheat-sheet-content" id="cheatSheetContent">
      <table class="cheat-table">
        <thead>
          <tr id="cheatTableHead"></tr>
        </thead>
        <tbody id="cheatTableBody"></tbody>
      </table>
      <div id="cheatSheetTip" style="margin-top: 0.75rem; font-size: 0.78rem; color: var(--text-muted); line-height: 1.5;">
        <!-- 动态语言填充 -->
      </div>
    </div>
  </div>

  <div class="shortcut-hint" id="shortcutHint">
    ショートカット: [Enter] 送信 / 次の問題 | [Space] 答え・解説表示 | CCNA目標回答時間: 1問あたり 15〜25 秒
  </div>
</div>

<script>
/**
 * 多语言辞书 (i18n Dictionary)
 */
const I18N = {

      ["/32", ".255", "8 ビット", "1", "1 (Host ルート / Loopback)"]
    ],
    cheatTip: `💡 <strong>CCNA 暗算テクニック (Magic Number Method)：</strong><br>
1. <strong>着目オクテット (Interesting Octet) を特定</strong>：/16〜/23 は第3オクテット、/24〜/30 は第4オクテット。<br>

/**
 * CCNA 子网计算工具类
 */
class SubnetUtils {
  static ipToInt(ip) {
    return ip.split('.').reduce((acc, octet) => ((acc << 8) + parseInt(octet, 10)) >>> 0, 0);
  }

  static intToIp(int) {
    return [
      (int >>> 24) & 255,
      (int >>> 16) & 255,
      (int >>> 8) & 255,
      int & 255
    ].join('.');
  }

  static prefixToMaskInt(prefix) {
    return prefix === 0 ? 0 : (~0 << (32 - prefix)) >>> 0;
  }

  static getOctets(ipStr) {
    return ipStr.split('.').map(Number);
  }

  static calc(ipStr, prefix) {
    const ipInt = this.ipToInt(ipStr);
    const maskInt = this.prefixToMaskInt(prefix);
    const wildcardInt = (~maskInt) >>> 0;

    const netInt = (ipInt & maskInt) >>> 0;
    const bcastInt = (netInt | wildcardInt) >>> 0;

    let firstHostInt, lastHostInt, hostsCount;
    if (prefix === 31) {
      firstHostInt = netInt;
      lastHostInt = bcastInt;
      hostsCount = 2;
    } else if (prefix === 32) {
      firstHostInt = netInt;
      lastHostInt = netInt;
      hostsCount = 1;
    } else {
      firstHostInt = (netInt + 1) >>> 0;
      lastHostInt = (bcastInt - 1) >>> 0;
      hostsCount = Math.pow(2, 32 - prefix) - 2;
    }

    const isBoundary = (prefix % 8 === 0);
    const octetIndex = isBoundary ? prefix / 8 : Math.floor(prefix / 8) + 1;

    const maskOctets = this.getOctets(this.intToIp(maskInt));
    const interestingMaskVal = isBoundary ? 255 : maskOctets[octetIndex - 1];
    const magicNumber = isBoundary ? 1 : 256 - interestingMaskVal;

    return {
      ip: ipStr,
      prefix,
      isBoundary,
      mask: this.intToIp(maskInt),
      network: this.intToIp(netInt),
      broadcast: this.intToIp(bcastInt),
      firstHost: this.intToIp(firstHostInt),
      lastHost: this.intToIp(lastHostInt),
      usableHosts: hostsCount,
      octetIndex,
      magicNumber,
      maskOctetVal: interestingMaskVal
    };
  }
}

/**
 * 全局状态 (默认日语、倒计时默认关闭)
 */
const state = {
  lang: 'ja',             // 默认语言: 日语
  timerEnabled: false,    // 倒计时默认关闭
  currentQuestion: null,
  answered: false,
  timerInterval: null,
  startTime: null,
  lastResult: null,
  stats: {
    total: 0,
    correct: 0,
    streak: 0
  }
};

function getT() {
  return I18N[state.lang] || I18N.ja;
}

// 随机 IP 生成
function generateRandomIP(prefix) {
  let o1, o2, o3, o4;
  if (prefix >= 24) {
    o1 = 192; o2 = 168;
    o3 = Math.floor(Math.random() * 254) + 1;
    o4 = Math.floor(Math.random() * 254) + 1;
  } else if (prefix >= 16) {
    o1 = 172;
    o2 = Math.floor(Math.random() * 16) + 16; // 172.16 - 172.31
    o3 = Math.floor(Math.random() * 254) + 1;
    o4 = Math.floor(Math.random() * 254) + 1;
  } else {
    o1 = 10;
    o2 = Math.floor(Math.random() * 254) + 1;
    o3 = Math.floor(Math.random() * 254) + 1;
    o4 = Math.floor(Math.random() * 254) + 1;
  }
  return `${o1}.${o2}.${o3}.${o4}`;
}

// 抽取前缀
function pickPrefix(scope) {
  if (scope === 'CLASS_C') return Math.floor(Math.random() * 7) + 24; // 24-30
  if (scope === 'CLASS_B') return Math.floor(Math.random() * 8) + 16; // 16-23
  if (scope === 'CLASS_A') return Math.floor(Math.random() * 8) + 8;  // 8-15
  return Math.floor(Math.random() * 13) + 18; // 混合重点
}

// 填充题目文本与解析
function populateQuestionTexts(q) {
  const t = getT();
  const sub = q.sub;
  const ip = q.ip;
  const prefix = q.prefix;

  switch (q.category) {
    case 'NET_ID':
      q.badge = t.categories.NET_ID;
      q.prompt = t.questions.NET_ID(ip, prefix);
      q.answer = sub.network;
      q.explanation = generateMagicExplanation(sub, 'network');
      break;

    case 'BROADCAST':
      q.badge = t.categories.BROADCAST;
      q.prompt = t.questions.BROADCAST(sub.network, prefix);
      q.answer = sub.broadcast;
      q.explanation = generateMagicExplanation(sub, 'broadcast');
      break;

    case 'FIRST_HOST':
      q.badge = t.categories.FIRST_HOST;
      q.prompt = t.questions.FIRST_HOST(ip, prefix);
      q.answer = sub.firstHost;
      q.explanation = generateMagicExplanation(sub, 'firstHost');
      break;

    case 'LAST_HOST':
      q.badge = t.categories.LAST_HOST;
      q.prompt = t.questions.LAST_HOST(ip, prefix);
      q.answer = sub.lastHost;
      q.explanation = generateMagicExplanation(sub, 'lastHost');
      break;

    case 'VALID_HOSTS':
      q.badge = t.categories.VALID_HOSTS;
      q.prompt = t.questions.VALID_HOSTS(prefix, sub.mask);
      q.answer = sub.usableHosts.toString();
      const hostBits = 32 - prefix;
      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.hostBits}</span>${t.explanations.validHostsH(prefix, hostBits)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.formula}</span>${t.explanations.validHostsFormula(hostBits, sub.usableHosts)}</div>
      `;
      break;

    case 'MASK_CONVERT':
      q.badge = t.categories.MASK_CONVERT;
      if (q.isCidrToMask) {
        q.prompt = t.questions.CIDR_TO_MASK(prefix);
        q.answer = sub.mask;
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.cidrPrefix}</span>/${prefix} ➔ <strong>${sub.mask}</strong></div>
        `;
      } else {
        q.prompt = t.questions.MASK_TO_CIDR(sub.mask, prefix);
        q.answer = prefix.toString();
        q.explanation = `
          <div class="magic-step"><span class="step-label">${t.stepLabels.maskDec}</span>${sub.mask} ➔ <strong>/${prefix}</strong></div>
        `;
      }
      break;

    case 'SAME_SUBNET':
      q.badge = t.categories.SAME_SUBNET;
      q.type = 'CHOICE';
      q.prompt = t.questions.SAME_SUBNET(ip, q.host2Ip, prefix);
      q.answer = q.isSame ? 'YES' : 'NO';
      const host2Sub = SubnetUtils.calc(q.host2Ip, prefix);
      q.explanation = `
        <div class="magic-step"><span class="step-label">${t.stepLabels.hostA}</span>${t.explanations.sameSubnetHostA(sub.network, prefix, sub.broadcast)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.hostB}</span>${t.explanations.sameSubnetHostB(host2Sub.network, prefix, host2Sub.broadcast)}</div>
        <div class="magic-step"><span class="step-label">${t.stepLabels.sameResult}</span>${q.isSame ? t.explanations.sameSubnetYes : t.explanations.sameSubnetNo}</div>
      `;
      break;
  }
}

// 题库生成
function createQuestion() {
  const scope = document.getElementById('prefixScope').value || 'ALL';
  let category = document.getElementById('categorySelect').value || 'ALL';

  const validCategories = ['NET_ID', 'BROADCAST', 'FIRST_HOST', 'LAST_HOST', 'VALID_HOSTS', 'MASK_CONVERT', 'SAME_SUBNET'];
  if (category === 'ALL') {
    category = validCategories[Math.floor(Math.random() * validCategories.length)];
  }

  const prefix = pickPrefix(scope);
  const ip = generateRandomIP(prefix);
  const sub = SubnetUtils.calc(ip, prefix);

  let q = {
    category,
    type: 'TEXT',
    sub,
    ip,
    prefix,
    isCidrToMask: Math.random() > 0.5
  };

  if (category === 'SAME_SUBNET') {
    q.isSame = Math.random() > 0.5;
    if (q.isSame) {
      const netInt = SubnetUtils.ipToInt(sub.network);
      const hostOffset = Math.min(sub.usableHosts, Math.floor(Math.random() * (sub.usableHosts || 2)) + 1);
      q.host2Ip = SubnetUtils.intToIp(netInt + hostOffset);
    } else {
      const diffNetInt = (SubnetUtils.ipToInt(sub.network) + (sub.magicNumber << (8 * (4 - sub.octetIndex)))) >>> 0;
      q.host2Ip = SubnetUtils.intToIp(diffNetInt + 1);
    }
  }

  populateQuestionTexts(q);
  return q;
}

// 格式化解析步骤 (魔术数字法)
function generateMagicExplanation(sub, targetField) {
  const t = getT();
  const targetDesc = t.explanations.targetDesc[targetField](sub[targetField]);

  if (sub.isBoundary) {
    return `
      <div class="magic-step"><span class="step-label">${t.stepLabels.boundary}</span>${t.explanations.boundaryStep1(sub.prefix, sub.mask)}</div>
      <div class="magic-step"><span class="step-label">${t.stepLabels.netHost}</span>${t.explanations.boundaryStep2(sub.prefix / 8)}</div>
      <div class="magic-step"><span class="step-label">${t.stepLabels.range}</span>${t.explanations.boundaryStep3(sub.network, sub.broadcast)}</div>
      <div class="magic-step"><span class="step-label">${t.stepLabels.result}</span>${targetDesc}</div>
    `;
  }

  const octetName = t.octets[sub.octetIndex - 1];
  const ipOctets = SubnetUtils.getOctets(sub.ip);
  const curOctetVal = ipOctets[sub.octetIndex - 1];
  const netOctets = SubnetUtils.getOctets(sub.network);
  const netOctetVal = netOctets[sub.octetIndex - 1];
  const factor = Math.floor(curOctetVal / sub.magicNumber);

  return `
    <div class="magic-step"><span class="step-label">${t.stepLabels.interestingOctet}</span>${t.explanations.magicStep1(sub.mask, octetName, sub.maskOctetVal)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.magicNumber}</span>${t.explanations.magicStep2(sub.maskOctetVal, sub.magicNumber)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.multiples}</span>${t.explanations.magicStep3(curOctetVal, netOctetVal, sub.magicNumber, factor)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.fullRange}</span>${t.explanations.magicStep4(sub.network, sub.broadcast)}</div>
    <div class="magic-step"><span class="step-label">${t.stepLabels.magicResult}</span>${targetDesc}</div>
  `;
}

// 渲染新题目
function loadNewQuestion() {
  const t = getT();
  state.answered = false;
  state.currentQuestion = createQuestion();

  const q = state.currentQuestion;
  document.getElementById('qTypeBadge').textContent = q.badge;
  document.getElementById('qPrompt').innerHTML = q.prompt;

  // 界面状态复位
  document.getElementById('answerBox').style.display = 'none';
  const inputEl = document.getElementById('answerInput');
  inputEl.value = '';
  inputEl.className = '';
  inputEl.placeholder = t.inputPlaceholder;
  
  const textRow = document.getElementById('textInputRow');
  const choiceGroup = document.getElementById('choiceGroup');

  if (q.type === 'CHOICE') {
    textRow.style.display = 'none';
    choiceGroup.style.display = 'flex';
  } else {
    textRow.style.display = 'flex';
    choiceGroup.style.display = 'none';
    inputEl.focus();
  }

  // 模式适配
  const mode = document.getElementById('modeSelect').value;
  if (mode === 'FLASHCARD') {
    textRow.style.display = 'none';
    choiceGroup.style.display = 'none';
    document.getElementById('revealBtn').textContent = t.revealBtnFlashcard;
  } else {
    document.getElementById('revealBtn').textContent = t.revealBtnPractice;
  }

  // 计时器处理 (默认关闭)
  clearInterval(state.timerInterval);
  const timerBadge = document.getElementById('timerDisplay');
  const timerVal = document.getElementById('timerVal');

  if (state.timerEnabled) {
    timerBadge.classList.add('active');
    state.startTime = Date.now();
    timerVal.textContent = '0.0s';
    state.timerInterval = setInterval(() => {
      const elapsed = ((Date.now() - state.startTime) / 1000).toFixed(1);
      timerVal.textContent = `${elapsed}s`;
    }, 100);
  } else {
    timerBadge.classList.remove('active');
    timerVal.textContent = t.timerDisplayOff;
  }
}

// 评判答案
function handleAnswer(userVal) {
  if (state.answered) return;
  state.answered = true;
  clearInterval(state.timerInterval);

  const t = getT();
  const q = state.currentQuestion;
  const isCorrect = userVal && userVal.trim().toUpperCase() === q.answer.trim().toUpperCase();

  state.lastResult = {
    isRevealed: userVal === null,
    isCorrect: isCorrect,
    userVal: userVal
  };

  state.stats.total++;
  if (isCorrect) {
    state.stats.correct++;
    state.stats.streak++;
  } else {
    state.stats.streak = 0;
  }
  updateStatsUI();

  const resultStatus = document.getElementById('resultStatus');
  const inputEl = document.getElementById('answerInput');

  if (userVal === null) {
    resultStatus.innerHTML = `<span class="result-badge" style="background:#475569; color:#f8fafc;">${t.resRevealed}</span>`;
  } else if (isCorrect) {
    resultStatus.innerHTML = `<span class="result-badge result-correct">${t.resCorrect}</span>`;
    inputEl.classList.add('correct');
  } else {
    resultStatus.innerHTML = `<span class="result-badge result-wrong">${t.resWrong.replace('{val}', escapeHtml(userVal))}</span>`;
    inputEl.classList.add('wrong');
  }

  document.getElementById('targetAnswer').textContent = q.answer;
  document.getElementById('targetAnswerLabel').textContent = t.targetAnswerLabel;
  document.getElementById('ccnaBreakdown').innerHTML = q.explanation;
  document.getElementById('answerBox').style.display = 'block';

  document.getElementById('nextBtn').focus();
}

function updateStatsUI() {
  document.getElementById('statStreak').textContent = state.stats.streak;
  document.getElementById('statTotal').textContent = state.stats.total;
  const acc = state.stats.total > 0 ? Math.round((state.stats.correct / state.stats.total) * 100) : 0;
  document.getElementById('statAccuracy').textContent = `${acc}%`;
}

function escapeHtml(text) {
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 更新界面所有静态文本为当前选定语言
function updateLanguageUI() {
  const t = getT();
  document.documentElement.lang = state.lang;

  // 标题与标签
  document.getElementById('appBadge').textContent = t.appBadge;
  document.getElementById('labelStreak').textContent = t.labelStreak;
  document.getElementById('labelTotal').textContent = t.labelTotal;
  document.getElementById('labelAccuracy').textContent = t.labelAccuracy;
  document.getElementById('labelCategory').textContent = t.labelCategory;
  document.getElementById('labelScope').textContent = t.labelScope;
  document.getElementById('labelMode').textContent = t.labelMode;
  document.getElementById('submitBtn').textContent = t.submitBtn;
  document.getElementById('nextBtn').textContent = t.nextBtn;
  document.getElementById('choiceBtnYes').textContent = t.choiceYes;
  document.getElementById('choiceBtnNo').textContent = t.choiceNo;
  document.getElementById('cheatSheetTitle').textContent = t.cheatTitle;
  document.getElementById('cheatSheetTip').innerHTML = t.cheatTip;
  document.getElementById('shortcutHint').textContent = t.shortcutHint;
  document.getElementById('targetAnswerLabel').textContent = t.targetAnswerLabel;

  // 修复：同步速查表折叠按钮箭头状态文本 (展开/收起)
  const cheatContent = document.getElementById('cheatSheetContent');
  const isCheatOpen = cheatContent && cheatContent.style.display === 'block';
  const cheatArrow = document.getElementById('cheatArrow');
  if (cheatArrow) {
    cheatArrow.textContent = isCheatOpen ? t.cheatClose : t.cheatOpen;
  }

  // 同步输入框占位符
  const inputEl = document.getElementById('answerInput');
  if (inputEl) {
    inputEl.placeholder = t.inputPlaceholder;
  }

  // 同步揭晓按钮文本
  const mode = document.getElementById('modeSelect').value;
  const revealBtn = document.getElementById('revealBtn');
  if (revealBtn) {
    revealBtn.textContent = (mode === 'FLASHCARD') ? t.revealBtnFlashcard : t.revealBtnPractice;
  }

  // 同步已揭晓/判定的结果状态徽章
  if (state.answered && state.lastResult) {
    const resultStatus = document.getElementById('resultStatus');
    if (resultStatus) {
      if (state.lastResult.isRevealed) {
        resultStatus.innerHTML = `<span class="result-badge" style="background:#475569; color:#f8fafc;">${t.resRevealed}</span>`;
      } else if (state.lastResult.isCorrect) {
        resultStatus.innerHTML = `<span class="result-badge result-correct">${t.resCorrect}</span>`;
      } else {
        resultStatus.innerHTML = `<span class="result-badge result-wrong">${t.resWrong.replace('{val}', escapeHtml(state.lastResult.userVal))}</span>`;
      }
    }
  }

  // 同步计时器关闭时的显示文本
  if (!state.timerEnabled) {
    const timerVal = document.getElementById('timerVal');
    if (timerVal) timerVal.textContent = t.timerDisplayOff;
  }

  // 动态渲染速查表表头与内容行
  const headEl = document.getElementById('cheatTableHead');
  if (headEl) {
    headEl.innerHTML = t.cheatHeadCols.map(col => `<th>${col}</th>`).join('');
  }
  const bodyEl = document.getElementById('cheatTableBody');
  if (bodyEl) {
    bodyEl.innerHTML = t.cheatRows.map(row => `
      <tr>
        <td>${row[0]}</td>
        <td>${row[1]}</td>
        <td>${row[2]}</td>
        <td><strong>${row[3]}</strong></td>
        <td>${row[4]}</td>
      </tr>
    `).join('');
  }

  // 计时器按钮文本
  const timerBtn = document.getElementById('timerToggleBtn');
  if (state.timerEnabled) {
    timerBtn.textContent = t.timerBtnOn;
    timerBtn.classList.add('active');
  } else {
    timerBtn.textContent = t.timerBtnOff;
    timerBtn.classList.remove('active');
  }

  // 刷新下拉菜单保留当前选中项
  const catSel = document.getElementById('categorySelect');
  const curCat = catSel.value || 'ALL';
  catSel.innerHTML = Object.entries(t.categories)
    .map(([k, v]) => `<option value="${k}" ${k === curCat ? 'selected' : ''}>${v}</option>`)
    .join('');

  const scopeSel = document.getElementById('prefixScope');
  const curScope = scopeSel.value || 'ALL';
  scopeSel.innerHTML = Object.entries(t.scopes)
    .map(([k, v]) => `<option value="${k}" ${k === curScope ? 'selected' : ''}>${v}</option>`)
    .join('');

  const modeSel = document.getElementById('modeSelect');
  const curMode = modeSel.value || 'INPUT';
  modeSel.innerHTML = Object.entries(t.modes)
    .map(([k, v]) => `<option value="${k}" ${k === curMode ? 'selected' : ''}>${v}</option>`)
    .join('');

  // 切换语言按钮高亮状态
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === state.lang);
  });
}

// 切换语言 (即时刷新当前题目与解析)
function setLanguage(lang) {
  if (state.lang === lang) return;
  state.lang = lang;
  updateLanguageUI();

  if (state.currentQuestion) {
    populateQuestionTexts(state.currentQuestion);
    document.getElementById('qTypeBadge').textContent = state.currentQuestion.badge;
    document.getElementById('qPrompt').innerHTML = state.currentQuestion.prompt;
    document.getElementById('ccnaBreakdown').innerHTML = state.currentQuestion.explanation;

    const mode = document.getElementById('modeSelect').value;
    if (mode === 'FLASHCARD') {
      document.getElementById('revealBtn').textContent = getT().revealBtnFlashcard;
    } else {
      document.getElementById('revealBtn').textContent = getT().revealBtnPractice;
    }
  } else {
    loadNewQuestion();
  }
}

// 切换计时器开启/关闭
function toggleTimer() {
  state.timerEnabled = !state.timerEnabled;
  const t = getT();
  const timerBtn = document.getElementById('timerToggleBtn');
  const timerBadge = document.getElementById('timerDisplay');
  const timerVal = document.getElementById('timerVal');

  if (state.timerEnabled) {
    timerBtn.textContent = t.timerBtnOn;
    timerBtn.classList.add('active');
    timerBadge.classList.add('active');
    state.startTime = Date.now();
    timerVal.textContent = '0.0s';
    clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
      const elapsed = ((Date.now() - state.startTime) / 1000).toFixed(1);
      timerVal.textContent = `${elapsed}s`;
    }, 100);
  } else {
    timerBtn.textContent = t.timerBtnOff;
    timerBtn.classList.remove('active');
    timerBadge.classList.remove('active');
    clearInterval(state.timerInterval);
    timerVal.textContent = t.timerDisplayOff;
  }
}

// 事件绑定
document.getElementById('submitBtn').addEventListener('click', () => {
  handleAnswer(document.getElementById('answerInput').value);
});

document.getElementById('revealBtn').addEventListener('click', () => {
  handleAnswer(null);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  loadNewQuestion();
});

document.getElementById('timerToggleBtn').addEventListener('click', toggleTimer);

document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    handleAnswer(e.target.getAttribute('data-choice'));
  });
});

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    setLanguage(e.target.getAttribute('data-lang'));
  });
});

document.getElementById('categorySelect').addEventListener('change', loadNewQuestion);
document.getElementById('prefixScope').addEventListener('change', loadNewQuestion);
document.getElementById('modeSelect').addEventListener('change', loadNewQuestion);

// 折叠速查表
document.getElementById('cheatSheetToggle').addEventListener('click', () => {
  const content = document.getElementById('cheatSheetContent');
  const arrow = document.getElementById('cheatArrow');
  const t = getT();
  if (content.style.display === 'block') {
    content.style.display = 'none';
    arrow.textContent = t.cheatOpen;
  } else {
    content.style.display = 'block';
    arrow.textContent = t.cheatClose;
  }
});

// 键盘快捷键监听
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (state.answered) {
      loadNewQuestion();
    } else {
      if (state.currentQuestion && state.currentQuestion.type === 'TEXT') {
        handleAnswer(document.getElementById('answerInput').value);
      }
    }
  } else if (e.code === 'Space') {
    if (document.activeElement !== document.getElementById('answerInput')) {
      e.preventDefault();
      if (!state.answered) {
        handleAnswer(null);
      } else {
        loadNewQuestion();
      }
    }
  }
});

// 初始化启动 (默认日语、倒计时关闭)
updateLanguageUI();
loadNewQuestion();
</script>
</body>
